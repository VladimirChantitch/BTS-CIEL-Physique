<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Plan simplifié de la salle de jeu vue de dessus : ruban de 10 m sur trois murs, alimentation et contrôleur au début du ruban, câble C1 de 4,0 m vers le milieu du ruban et câble C2 de 4,5 m vers la fin du ruban">
<rect id="fond-blanc" x="0" y="0" width="700" height="470" fill="#ffffff"/>
<!-- Murs de la salle (porte sur le mur de devant) -->
<rect x="170" y="70" width="360" height="270" fill="#fafafa" stroke="none" stroke-width="1"/>
<polyline points="420,340 170,340 170,70 530,70 530,340 480,340" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
<path d="M 420 340 A 60 60 0 0 1 480 280" fill="none" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="480" y1="340" x2="480" y2="280" stroke="#777" stroke-width="1.6"/>
<text x="450" y="356" font-size="11" text-anchor="middle" fill="#555">porte</text>
<!-- Postes de jeu -->
<rect x="192" y="120" width="30" height="50" fill="#e6e6e6" stroke="#999" stroke-width="1" rx="3"/>
<rect x="192" y="185" width="30" height="50" fill="#e6e6e6" stroke="#999" stroke-width="1" rx="3"/>
<rect x="478" y="120" width="30" height="50" fill="#e6e6e6" stroke="#999" stroke-width="1" rx="3"/>
<rect x="478" y="185" width="30" height="50" fill="#e6e6e6" stroke="#999" stroke-width="1" rx="3"/>
<!-- Ruban LED sur trois murs (10 m) -->
<polyline points="180,330 180,80 520,80 520,330" fill="none" stroke="#f0b429" stroke-width="7" stroke-linejoin="round"/>
<polyline points="180,330 180,80 520,80 520,330" fill="none" stroke="#8a6d1f" stroke-width="1" stroke-linejoin="round"/>
<circle cx="180" cy="330" r="4.5" fill="#111" stroke="none" stroke-width="1"/>
<circle cx="180" cy="80" r="4.5" fill="#111" stroke="none" stroke-width="1"/>
<circle cx="350" cy="80" r="4.5" fill="#111" stroke="none" stroke-width="1"/>
<circle cx="520" cy="80" r="4.5" fill="#111" stroke="none" stroke-width="1"/>
<circle cx="520" cy="330" r="4.5" fill="#111" stroke="none" stroke-width="1"/>
<text x="160" y="334" font-size="12" text-anchor="end" fill="#111">x = 0 (début)</text>
<text x="160" y="84" font-size="12" text-anchor="end" fill="#111">x = 3 m</text>
<text x="350" y="60" font-size="12" text-anchor="middle" fill="#111">x = 5 m (milieu)</text>
<text x="540" y="84" font-size="12" text-anchor="start" fill="#111">x = 7 m</text>
<text x="540" y="334" font-size="12" text-anchor="start" fill="#111">x = 10 m (fin)</text>
<!-- Alimentation et contrôleur -->
<rect x="196" y="262" width="112" height="52" fill="#ffffff" stroke="#111" stroke-width="1.5" rx="4"/>
<text x="252" y="284" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">alimentation</text>
<text x="252" y="302" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">+ contrôleur</text>
<line x1="196" y1="300" x2="184" y2="326" stroke="#111" stroke-width="2.5"/>
<!-- Câbles de réinjection prévus -->
<polyline points="262,262 347,86" fill="none" stroke="#1f6f8b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 5"/>
<rect x="306" y="150" width="150" height="36" fill="#ffffff" stroke="#1f6f8b" stroke-width="1" rx="4"/>
<text x="381" y="165" font-size="12" text-anchor="middle" fill="#1f6f8b" font-weight="bold">câble C1 : 4,0 m</text>
<text x="381" y="180" font-size="11" text-anchor="middle" fill="#1f6f8b">(dans le faux plafond)</text>
<polyline points="308,306 330,326 508,326 517,331" fill="none" stroke="#1f6f8b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 5"/>
<text x="330" y="372" font-size="12" text-anchor="middle" fill="#1f6f8b" font-weight="bold">câble C2 : 4,5 m (le long du mur de la porte)</text>
<!-- Légende -->
<line x1="80" y1="420" x2="120" y2="420" stroke="#f0b429" stroke-width="7"/>
<text x="128" y="424" font-size="12" text-anchor="start" fill="#111">ruban LED (10 m)</text>
<line x1="260" y1="420" x2="300" y2="420" stroke="#1f6f8b" stroke-width="2.4" stroke-dasharray="8 5"/>
<text x="308" y="424" font-size="12" text-anchor="start" fill="#111">câbles de réinjection prévus</text>
<rect x="500" y="410" width="14" height="22" fill="#e6e6e6" stroke="#999" stroke-width="1" rx="2"/>
<text x="522" y="424" font-size="12" text-anchor="start" fill="#111">poste de jeu</text>
<text x="350" y="452" font-size="11" text-anchor="middle" fill="#777" font-style="italic">plan simplifié, sans échelle</text>
</svg>
