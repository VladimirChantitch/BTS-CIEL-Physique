<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bond hertzien entre deux pylônes : antennes paraboliques, ligne de visée, première zone de Fresnel et flèche due à la courbure de la Terre">
<rect id="fond-blanc" x="0" y="0" width="700" height="350" fill="#ffffff"/>
<!-- Sol : la Terre bombe entre les deux pylônes (échelle verticale très dilatée) -->
<path d="M 30.0 300.0 Q 350.0 224.0 670.0 300.0 L 670.0 350.0 L 30.0 350.0 Z" fill="#f4efe4" stroke="none" stroke-width="1.6"/>
<path d="M 30.0 300.0 Q 350.0 224.0 670.0 300.0" fill="none" stroke="#111" stroke-width="2"/>
<!-- Obstacle sous le faisceau : colline boisée -->
<polygon points="200.0,270.3 210.0,258.0 220.0,247.8 230.0,239.7 240.0,233.7 250.0,229.9 260.0,228.2 270.0,228.6 280.0,231.1 290.0,235.7 300.0,242.5 310.0,251.3 320.0,262.3 320.0,262.3 310.0,262.6 300.0,262.9 290.0,263.3 280.0,263.8 270.0,264.4 260.0,265.0 250.0,265.7 240.0,266.5 230.0,267.3 220.0,268.3 210.0,269.3 200.0,270.3" fill="#e7efd9" stroke="#45700f" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="236.0,214.9 229.0,238.9 243.0,238.9" fill="#45700f" stroke="#45700f" stroke-width="1" stroke-linejoin="round"/>
<polygon points="248.0,209.5 241.0,233.5 255.0,233.5" fill="#45700f" stroke="#45700f" stroke-width="1" stroke-linejoin="round"/>
<polygon points="260.0,207.2 253.0,231.2 267.0,231.2" fill="#45700f" stroke="#45700f" stroke-width="1" stroke-linejoin="round"/>
<polygon points="272.0,207.9 265.0,231.9 279.0,231.9" fill="#45700f" stroke="#45700f" stroke-width="1" stroke-linejoin="round"/>
<polygon points="284.0,211.7 277.0,235.7 291.0,235.7" fill="#45700f" stroke="#45700f" stroke-width="1" stroke-linejoin="round"/>
<text x="306.0" y="222.0" font-size="12" text-anchor="start" fill="#45700f">obstacle</text>
<text x="306.0" y="237.0" font-size="12" text-anchor="start" fill="#45700f">(crête boisée)</text>
<!-- Flèche h : hauteur du sol au-dessus de la corde qui joint les pieds des pylônes -->
<line x1="110.0" y1="283.4" x2="590.0" y2="283.4" stroke="#777" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="350.0" y1="278.6" x2="350.0" y2="267.4" stroke="#d9480f" stroke-width="1.6"/>
<polygon points="350.0,262.6 352.7,268.6 347.3,268.6" fill="#d9480f" stroke="#d9480f" stroke-width="1" stroke-linejoin="round"/>
<polygon points="350.0,283.4 347.3,277.4 352.7,277.4" fill="#d9480f" stroke="#d9480f" stroke-width="1" stroke-linejoin="round"/>
<text x="360.0" y="280.0" font-size="13" text-anchor="start" fill="#d9480f" font-weight="bold">flèche h</text>
<text x="560.0" y="335.0" font-size="12" text-anchor="middle" fill="#555" font-style="italic">Terre de rayon fictif kR</text>
<!-- Pylônes en treillis (pieds sur le sol bombé) -->
<polyline points="96.0,283.4 106.0,136.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polyline points="124.0,283.4 114.0,136.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polyline points="96.0,283.4 122.3,258.8 99.3,234.3 119.0,209.7 102.7,185.1 115.7,160.6 106.0,136.0" fill="none" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<polyline points="576.0,283.4 586.0,136.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polyline points="604.0,283.4 594.0,136.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<polyline points="576.0,283.4 602.3,258.8 579.3,234.3 599.0,209.7 582.7,185.1 595.7,160.6 586.0,136.0" fill="none" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="110.0" y="318.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">P7</text>
<text x="590.0" y="318.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">P8</text>
<!-- Antennes paraboliques en vis-à-vis (source au foyer) -->
<path d="M 124.0 106.0 Q 100.0 130.0 124.0 154.0" fill="#ffffff" stroke="#111" stroke-width="3"/>
<line x1="112.0" y1="130.0" x2="140.0" y2="130.0" stroke="#111" stroke-width="1.5"/>
<circle cx="142.0" cy="130.0" r="3.0" fill="#111" stroke="none" stroke-width="1"/>
<path d="M 576.0 106.0 Q 600.0 130.0 576.0 154.0" fill="#ffffff" stroke="#111" stroke-width="3"/>
<line x1="560.0" y1="130.0" x2="588.0" y2="130.0" stroke="#111" stroke-width="1.5"/>
<circle cx="558.0" cy="130.0" r="3.0" fill="#111" stroke="none" stroke-width="1"/>
<line x1="122.0" y1="158.0" x2="150.0" y2="182.0" stroke="#555" stroke-width="1"/>
<text x="152.0" y="194.0" font-size="12" text-anchor="start" fill="#555">antenne parabolique</text>
<!-- Première zone de Fresnel (ellipsoïde autour de la ligne de visée) -->
<ellipse cx="350.0" cy="130.0" rx="208.0" ry="46.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.6" stroke-dasharray="6 4" fill-opacity="0.08"/>
<line x1="142.0" y1="130.0" x2="558.0" y2="130.0" stroke="#1f6f8b" stroke-width="2"/>
<text x="470.0" y="124.0" font-size="12" text-anchor="middle" fill="#1f6f8b">ligne de visée</text>
<text x="478.0" y="88.0" font-size="12" text-anchor="start" fill="#1f6f8b">première zone de Fresnel</text>
<!-- Rayon r1 de la zone de Fresnel au point situé à d1 de P7 -->
<line x1="260.0" y1="130.0" x2="260.0" y2="166.7" stroke="#d9480f" stroke-width="1.6"/>
<polygon points="260.0,171.5 257.3,165.5 262.7,165.5" fill="#d9480f" stroke="#d9480f" stroke-width="1" stroke-linejoin="round"/>
<text x="268.0" y="163.5" font-size="14" text-anchor="start" fill="#d9480f" font-weight="bold">r₁</text>
<!-- Cotes : d1, d2 et d -->
<line x1="142.0" y1="22.0" x2="142.0" y2="124.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="558.0" y1="22.0" x2="558.0" y2="124.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="260.0" y1="54.0" x2="260.0" y2="124.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="146.8" y1="62.0" x2="255.2" y2="62.0" stroke="#111" stroke-width="1.2"/>
<polygon points="260.0,62.0 254.0,64.7 254.0,59.3" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<polygon points="142.0,62.0 148.0,59.3 148.0,64.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<line x1="264.8" y1="62.0" x2="553.2" y2="62.0" stroke="#111" stroke-width="1.2"/>
<polygon points="558.0,62.0 552.0,64.7 552.0,59.3" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<polygon points="260.0,62.0 266.0,59.3 266.0,64.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<line x1="146.8" y1="30.0" x2="553.2" y2="30.0" stroke="#111" stroke-width="1.2"/>
<polygon points="558.0,30.0 552.0,32.7 552.0,27.3" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<polygon points="142.0,30.0 148.0,27.3 148.0,32.7" fill="#111" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
<text x="201.0" y="56.0" font-size="14" text-anchor="middle" fill="#111">d₁</text>
<text x="409.0" y="56.0" font-size="14" text-anchor="middle" fill="#111">d₂</text>
<text x="350.0" y="24.0" font-size="14" text-anchor="middle" fill="#111">d = d₁ + d₂</text>
</svg>
