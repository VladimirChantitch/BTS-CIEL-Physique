<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Ligne adaptée et ligne non adaptée" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect id="fond-blanc" x="0" y="0" width="660" height="340" fill="#ffffff"/>
<text x="20.0" y="22.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Ligne adaptée : R<tspan baseline-shift="sub" font-size="72%">CH</tspan> = Z<tspan baseline-shift="sub" font-size="72%">C</tspan>, ρ = 0</text>
<rect x="20.0" y="71.0" width="60.0" height="50.0" rx="6" fill="#fffdf9" stroke="#111" stroke-width="2"/>
<text x="50.0" y="101.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Gén.</text>
<line x1="80.0" y1="78.0" x2="540.0" y2="78.0" stroke="#111" stroke-width="2"/>
<line x1="80.0" y1="114.0" x2="540.0" y2="114.0" stroke="#111" stroke-width="2"/>
<text x="96.0" y="101.0" font-size="12" text-anchor="start" fill="#777">ligne d’impédance caractéristique Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="540.0" y1="78.0" x2="540.0" y2="83.0" stroke="#111" stroke-width="2"/>
<line x1="540.0" y1="109.0" x2="540.0" y2="114.0" stroke="#111" stroke-width="2"/>
<rect x="533.0" y="83.0" width="14.0" height="26.0" rx="0" fill="none" stroke="#111" stroke-width="2"/>
<text x="556.0" y="101.0" font-size="13" text-anchor="start" fill="#111">R<tspan baseline-shift="sub" font-size="72%">CH</tspan> = Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="120.0" y1="60.0" x2="472.0" y2="60.0" stroke="#d9480f" stroke-width="2.4"/>
<polygon points="480.0,60.0 471.3,65.0 471.3,55.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="300.0" y="52.0" font-size="12" text-anchor="middle" fill="#d9480f">onde incidente, toute absorbée par la charge</text>
<text x="20.0" y="186.0" font-size="15" text-anchor="start" fill="#111" font-weight="bold">Ligne non adaptée : R<tspan baseline-shift="sub" font-size="72%">CH</tspan> ≠ Z<tspan baseline-shift="sub" font-size="72%">C</tspan>, ρ ≠ 0</text>
<rect x="20.0" y="235.0" width="60.0" height="50.0" rx="6" fill="#fffdf9" stroke="#111" stroke-width="2"/>
<text x="50.0" y="265.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Gén.</text>
<line x1="80.0" y1="242.0" x2="540.0" y2="242.0" stroke="#111" stroke-width="2"/>
<line x1="80.0" y1="278.0" x2="540.0" y2="278.0" stroke="#111" stroke-width="2"/>
<text x="96.0" y="265.0" font-size="12" text-anchor="start" fill="#777">ligne d’impédance caractéristique Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="540.0" y1="242.0" x2="540.0" y2="247.0" stroke="#111" stroke-width="2"/>
<line x1="540.0" y1="273.0" x2="540.0" y2="278.0" stroke="#111" stroke-width="2"/>
<rect x="533.0" y="247.0" width="14.0" height="26.0" rx="0" fill="none" stroke="#111" stroke-width="2"/>
<text x="556.0" y="265.0" font-size="13" text-anchor="start" fill="#111">R<tspan baseline-shift="sub" font-size="72%">CH</tspan> ≠ Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="120.0" y1="224.0" x2="472.0" y2="224.0" stroke="#d9480f" stroke-width="2.4"/>
<polygon points="480.0,224.0 471.3,229.0 471.3,219.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="300.0" y="216.0" font-size="12" text-anchor="middle" fill="#d9480f">onde incidente</text>
<line x1="480.0" y1="296.0" x2="128.0" y2="296.0" stroke="#1f6f8b" stroke-width="2.4"/>
<polygon points="120.0,296.0 128.7,291.0 128.7,301.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="300.0" y="316.0" font-size="12" text-anchor="middle" fill="#1f6f8b">onde réfléchie</text>
</svg>
