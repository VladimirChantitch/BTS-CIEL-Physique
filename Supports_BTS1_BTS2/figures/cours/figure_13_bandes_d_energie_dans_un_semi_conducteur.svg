<!-- Bandes d'énergie dans un semi-conducteur -->
<!-- Coordonnées : origine en haut à gauche, x vers la droite, y vers le bas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Arial, Helvetica, sans-serif" aria-label="Bandes d'énergie dans un semi-conducteur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Fond blanc -->
  <rect width="100%" height="100%" fill="white"/>
  <rect x="80" y="30" width="300" height="60" fill="#c9d8de" stroke="#111" stroke-width="1.5"/>

  <!-- Bande de conduction -->
  <text x="230" y="55" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Bande de conduction</text>
  <text x="230" y="75" font-size="12" text-anchor="middle" fill="#777">électrons libres</text>
  <rect x="80" y="90" width="300" height="60" fill="#fbe4d6" stroke="#111" stroke-width="1.5"/>

  <!-- Gap (bande interdite) ΔE -->
  <text x="230" y="125" font-size="15" text-anchor="middle" fill="#d9480f" font-weight="bold">Gap (bande interdite) ΔE</text>
  <rect x="80" y="150" width="300" height="60" fill="#c9d8de" stroke="#111" stroke-width="1.5"/>

  <!-- Bande de valence -->
  <text x="230" y="175" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Bande de valence</text>
  <text x="230" y="195" font-size="12" text-anchor="middle" fill="#777">électrons liés</text>
  <line x1="500" y1="150" x2="500" y2="101" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="500,90 505,101 495,101" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
  <text x="515" y="125" font-size="13" text-anchor="start" fill="#d9480f">ΔE ≈ 1,1 eV (Si)</text>
  <line x1="40" y1="200" x2="40" y2="51" stroke="#111" stroke-width="2.5"/>
  <polygon points="40,40 45,51 35,51" fill="#111" stroke="#111" stroke-width="1"/>
  <text x="40" y="25" font-size="14" text-anchor="middle" fill="#111">E</text>
  <circle cx="350" cy="180" r="6" fill="#111" stroke="#111" stroke-width="2"/>
  <line x1="350" y1="172" x2="350" y2="79" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="350,68 355,79 345,79" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <circle cx="350" cy="60" r="6" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2"/>
  <text x="395" y="50" font-size="11" text-anchor="start" fill="#1f6f8b">électron promu</text>
  <circle cx="350" cy="180" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="395" y="195" font-size="11" text-anchor="start" fill="#777">trou laissé</text>
</svg>
