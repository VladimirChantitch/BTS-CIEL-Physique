<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Montage inverseur à amplificateur opérationnel : R1 en entrée, R2 en contre-réaction">
<rect id="fond-blanc" x="0" y="0" width="620" height="340" fill="#ffffff"/>
<!-- entrée et résistance R1 -->
<circle cx="70.0" cy="140.0" r="4.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="74.0" y1="140.0" x2="110.0" y2="140.0" stroke="#111" stroke-width="2"/>
<rect x="110.0" y="130.0" width="60.0" height="20.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="170.0" y1="140.0" x2="300.0" y2="140.0" stroke="#111" stroke-width="2"/>
<text x="140.0" y="122.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">R<tspan baseline-shift="sub" font-size="12">1</tspan></text>
<!-- nœud de l'entrée − -->
<circle cx="230.0" cy="140.0" r="3.5" fill="#111" stroke="#111" stroke-width="1"/>
<!-- contre-réaction R2 -->
<line x1="230.0" y1="140.0" x2="230.0" y2="60.0" stroke="#111" stroke-width="2"/>
<line x1="230.0" y1="60.0" x2="300.0" y2="60.0" stroke="#111" stroke-width="2"/>
<rect x="300.0" y="50.0" width="60.0" height="20.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="360.0" y1="60.0" x2="470.0" y2="60.0" stroke="#111" stroke-width="2"/>
<line x1="470.0" y1="60.0" x2="470.0" y2="170.0" stroke="#111" stroke-width="2"/>
<text x="330.0" y="42.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">R<tspan baseline-shift="sub" font-size="12">2</tspan></text>
<!-- AOP -->
<polygon points="300.0,110.0 300.0,230.0 410.0,170.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="342.0" y="176.0" font-size="20" text-anchor="middle" fill="#111">∞</text>
<text x="313.0" y="146.0" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">−</text>
<text x="313.0" y="206.0" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">+</text>
<!-- sortie -->
<line x1="410.0" y1="170.0" x2="550.0" y2="170.0" stroke="#111" stroke-width="2"/>
<circle cx="470.0" cy="170.0" r="3.5" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="554.0" cy="170.0" r="4.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<!-- entrée + à la masse -->
<line x1="300.0" y1="200.0" x2="262.0" y2="200.0" stroke="#111" stroke-width="2"/>
<line x1="262.0" y1="200.0" x2="262.0" y2="280.0" stroke="#111" stroke-width="2"/>
<circle cx="262.0" cy="280.0" r="3.5" fill="#111" stroke="#111" stroke-width="1"/>
<!-- ligne de masse -->
<circle cx="70.0" cy="280.0" r="4.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="74.0" y1="280.0" x2="550.0" y2="280.0" stroke="#111" stroke-width="2"/>
<circle cx="554.0" cy="280.0" r="4.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="262.0" y1="284.0" x2="262.0" y2="294.0" stroke="#111" stroke-width="2"/>
<line x1="249.0" y1="294.0" x2="275.0" y2="294.0" stroke="#111" stroke-width="2"/>
<line x1="254.0" y1="299.0" x2="270.0" y2="299.0" stroke="#111" stroke-width="2"/>
<line x1="259.0" y1="304.0" x2="265.0" y2="304.0" stroke="#111" stroke-width="2"/>
<!-- tensions -->
<line x1="48.0" y1="274.0" x2="48.0" y2="157.0" stroke="#d9480f" stroke-width="2"/>
<polygon points="48.0,148.0 52.5,158.0 43.5,158.0" fill="#d9480f" stroke="none"/>
<text x="40.0" y="217.0" font-size="16" text-anchor="end" fill="#d9480f" font-weight="bold">e</text>
<line x1="578.0" y1="274.0" x2="578.0" y2="187.0" stroke="#1f6f8b" stroke-width="2"/>
<polygon points="578.0,178.0 582.5,188.0 573.5,188.0" fill="#1f6f8b" stroke="none"/>
<text x="586.0" y="232.0" font-size="16" text-anchor="start" fill="#1f6f8b" font-weight="bold">s</text>
<!-- tension différentielle nulle -->
<line x1="286.0" y1="196.0" x2="286.0" y2="152.0" stroke="#777" stroke-width="1.4"/>
<polygon points="286.0,146.0 289.0,153.0 283.0,153.0" fill="#777" stroke="none"/>
<text x="280.0" y="178.0" font-size="14" text-anchor="end" fill="#777">v<tspan baseline-shift="sub" font-size="10">d</tspan> = 0</text>
<!-- courant i -->
<line x1="80.0" y1="128.0" x2="98.0" y2="128.0" stroke="#45700f" stroke-width="1.6"/>
<polygon points="104.0,128.0 97.0,131.0 97.0,125.0" fill="#45700f" stroke="none"/>
<text x="92.0" y="122.0" font-size="15" text-anchor="middle" fill="#45700f" font-weight="bold" font-style="italic">i</text>
<line x1="395.0" y1="48.0" x2="419.0" y2="48.0" stroke="#45700f" stroke-width="1.6"/>
<polygon points="425.0,48.0 418.0,51.0 418.0,45.0" fill="#45700f" stroke="none"/>
<text x="410.0" y="42.0" font-size="15" text-anchor="middle" fill="#45700f" font-weight="bold" font-style="italic">i</text>
<!-- relation -->
<text x="310.0" y="328.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">s = −(R<tspan baseline-shift="sub" font-size="12">2</tspan> / R<tspan baseline-shift="sub" font-size="12">1</tspan>) × e</text>
</svg>
