<!-- Absorption/émission d'un photon par un atome -->
<!-- Coordonnées : origine en haut à gauche, x vers la droite, y vers le bas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" font-family="Arial, Helvetica, sans-serif" aria-label="Absorption/émission d'un photon par un atome" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Fond blanc -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Absorption -->
  <text x="130" y="30" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Absorption</text>
  <line x1="50" y1="60" x2="210" y2="60" stroke="#111" stroke-width="2"/>
  <text x="220" y="65" font-size="14" text-anchor="start" fill="#111">E₂</text>
  <line x1="50" y1="170" x2="210" y2="170" stroke="#111" stroke-width="2"/>
  <text x="220" y="175" font-size="14" text-anchor="start" fill="#111">E₁</text>
  <circle cx="130" cy="170" r="7" fill="#111" stroke="#111" stroke-width="2"/>
  <line x1="130" y1="160" x2="130" y2="83" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="130,72 135,83 125,83" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <circle cx="130" cy="60" r="7" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M20 115 q8 -12 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#d9480f" stroke-width="2"/>
  <line x1="96" y1="115" x2="107" y2="115" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="118,115 107,120 107,110" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
  <text x="60" y="95" font-size="12" text-anchor="middle" fill="#d9480f">photon hν</text>
  <text x="130" y="215" font-size="14" text-anchor="middle" fill="#111">hν = E₂ − E₁</text>

  <!-- Émission -->
  <text x="400" y="30" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Émission</text>
  <line x1="320" y1="60" x2="480" y2="60" stroke="#111" stroke-width="2"/>
  <text x="490" y="65" font-size="14" text-anchor="start" fill="#111">E₂</text>
  <line x1="320" y1="170" x2="480" y2="170" stroke="#111" stroke-width="2"/>
  <text x="490" y="175" font-size="14" text-anchor="start" fill="#111">E₁</text>
  <circle cx="400" cy="60" r="7" fill="#111" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="70" x2="400" y2="149" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="400,160 395,149 405,149" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <circle cx="400" cy="170" r="7" fill="#fff" stroke="#1f6f8b" stroke-width="2"/>
  <path d="M430 115 q8 -12 16 0 t16 0 t16 0 t16 0" fill="none" stroke="#d9480f" stroke-width="2"/>
  <line x1="494" y1="115" x2="509" y2="115" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="520,115 509,120 509,110" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
  <text x="470" y="95" font-size="12" text-anchor="middle" fill="#d9480f">photon hν</text>
  <text x="400" y="215" font-size="13" text-anchor="middle" fill="#777">mécanisme de la LED et du laser</text>
</svg>
