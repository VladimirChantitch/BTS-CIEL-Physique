<text x="320.0" y="256.0" font-size="12" text-anchor="middle" fill="#777">Le point de départ de chaque chirp (point bleu) code SF bits. Durée d'un symbole : T<tspan baseline-shift="sub" font-size="72%">s</tspan> = 2<tspan baseline-shift="super" font-size="72%">SF</tspan> / B.</text>
<text x="320.0" y="273.0" font-size="12" text-anchor="middle" fill="#777">SF + 1 : symbole deux fois plus long, débit divisé par deux, sensibilité améliorée d'environ 2,5 dB.</text>
