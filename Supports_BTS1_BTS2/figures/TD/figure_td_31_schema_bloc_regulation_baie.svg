<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Schéma-bloc de la régulation de température d'une baie de serveurs par la vitesse du ventilateur">
<rect id="fond-blanc" x="0" y="0" width="880" height="280" fill="#ffffff"/>
<!-- Consigne et comparateur -->
<line x1="10.0" y1="130.0" x2="94.0" y2="130.0" stroke="#111" stroke-width="2"/>
<polygon points="104.0,130.0 94.0,134.5 94.0,125.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="12.0" y="118.0" font-size="15" fill="#111" font-weight="bold">consigne θ<tspan baseline-shift="sub" font-size="11">c</tspan></text>
<circle cx="120.0" cy="130.0" r="16.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="108.7" y1="118.7" x2="131.3" y2="141.3" stroke="#111" stroke-width="2"/>
<line x1="108.7" y1="141.3" x2="131.3" y2="118.7" stroke="#111" stroke-width="2"/>
<text x="98.0" y="114.0" font-size="16" fill="#111" font-weight="bold">+</text>
<text x="100.0" y="164.0" font-size="18" fill="#111" font-weight="bold">−</text>
<!-- Chaîne directe : correcteur, actionneur, système -->
<line x1="136.0" y1="130.0" x2="170.0" y2="130.0" stroke="#111" stroke-width="2"/>
<polygon points="180.0,130.0 170.0,134.5 170.0,125.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="158.0" y="120.0" font-size="15" text-anchor="middle" fill="#d9480f">ε</text>
<rect x="180.0" y="102.0" width="120.0" height="56.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="240.0" y="135.0" font-size="15" text-anchor="middle" fill="#111">Correcteur</text>
<line x1="300.0" y1="130.0" x2="365.0" y2="130.0" stroke="#111" stroke-width="2"/>
<polygon points="375.0,130.0 365.0,134.5 365.0,125.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="337.0" y="120.0" font-size="13" text-anchor="middle" fill="#777">commande</text>
<rect x="375.0" y="102.0" width="150.0" height="56.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="450.0" y="126.0" font-size="15" text-anchor="middle" fill="#111">Variateur +</text>
<text x="450.0" y="144.0" font-size="15" text-anchor="middle" fill="#111">ventilateur</text>
<line x1="525.0" y1="130.0" x2="580.0" y2="130.0" stroke="#111" stroke-width="2"/>
<polygon points="590.0,130.0 580.0,134.5 580.0,125.5" fill="#111" stroke="#111" stroke-width="1"/>
<rect x="590.0" y="102.0" width="150.0" height="56.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="665.0" y="126.0" font-size="15" text-anchor="middle" fill="#111">Baie de</text>
<text x="665.0" y="144.0" font-size="15" text-anchor="middle" fill="#111">serveurs</text>
<!-- Sortie : température de l'air en sortie de baie -->
<line x1="740.0" y1="130.0" x2="855.0" y2="130.0" stroke="#111" stroke-width="2"/>
<polygon points="865.0,130.0 855.0,134.5 855.0,125.5" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="800.0" cy="130.0" r="3.5" fill="#111" stroke="none"/>
<text x="865.0" y="118.0" font-size="16" text-anchor="end" fill="#111" font-weight="bold">θ</text>
<!-- Perturbation : puissance dissipée par les serveurs -->
<line x1="665.0" y1="30.0" x2="665.0" y2="92.0" stroke="#45700f" stroke-width="2"/>
<polygon points="665.0,102.0 660.5,92.0 669.5,92.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="677.0" y="40.0" font-size="14" fill="#45700f">puissance dissipée P</text>
<text x="677.0" y="58.0" font-size="14" fill="#45700f">(perturbation)</text>
<!-- Chaîne de retour : capteur de température -->
<polyline points="800.0,130.0 800.0,235.0 560.0,235.0" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="560.0,235.0 570.0,230.5 570.0,239.5" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<rect x="380.0" y="207.0" width="180.0" height="56.0" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="2"/>
<text x="470.0" y="240.0" font-size="15" text-anchor="middle" fill="#111">Sonde de température</text>
<polyline points="380.0,235.0 120.0,235.0 120.0,156.0" fill="none" stroke="#1f6f8b" stroke-width="2" stroke-linejoin="round"/>
<polygon points="120.0,146.0 115.5,156.0 124.5,156.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="130.0" y="222.0" font-size="14" fill="#1f6f8b">mesure</text>
</svg>
