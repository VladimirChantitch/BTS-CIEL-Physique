<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Canalisation métallique de 102 m frappée à une extrémité : le son arrive à l'autre extrémité par le métal puis par l'air">
<rect id="fond-blanc" x="0" y="0" width="640" height="255" fill="#ffffff"/>
<!-- Personnage : technicien -->
<circle cx="50.0" cy="112.0" r="10.0" fill="none" stroke="#111" stroke-width="2"/>
<line x1="50.0" y1="122.0" x2="50.0" y2="160.0" stroke="#111" stroke-width="2"/>
<line x1="50.0" y1="160.0" x2="40.0" y2="190.0" stroke="#111" stroke-width="2"/>
<line x1="50.0" y1="160.0" x2="60.0" y2="190.0" stroke="#111" stroke-width="2"/>
<text x="50.0" y="88.0" font-size="14" text-anchor="middle" fill="#111">technicien</text>
<!-- Bras et marteau du technicien -->
<line x1="50.0" y1="135.0" x2="78.0" y2="130.0" stroke="#111" stroke-width="2"/>
<rect x="76.0" y="118.0" width="10.0" height="24.0" fill="#555" stroke="#111" stroke-width="1"/>
<!-- Personnage : collègue -->
<circle cx="592.0" cy="112.0" r="10.0" fill="none" stroke="#111" stroke-width="2"/>
<line x1="592.0" y1="122.0" x2="592.0" y2="160.0" stroke="#111" stroke-width="2"/>
<line x1="592.0" y1="160.0" x2="582.0" y2="190.0" stroke="#111" stroke-width="2"/>
<line x1="592.0" y1="160.0" x2="602.0" y2="190.0" stroke="#111" stroke-width="2"/>
<text x="592.0" y="88.0" font-size="14" text-anchor="middle" fill="#111">collègue</text>
<line x1="592.0" y1="135.0" x2="568.0" y2="132.0" stroke="#111" stroke-width="2"/>
<!-- Canalisation en acier -->
<rect x="90.0" y="128.0" width="460.0" height="18.0" fill="#cfcfcf" stroke="#111" stroke-width="2"/>
<line x1="100.0" y1="137.0" x2="530.0" y2="137.0" stroke="#d9480f" stroke-width="3"/>
<polygon points="540.0,137.0 530.0,141.5 530.0,132.5" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="320.0" y="170.0" font-size="14" text-anchor="middle" fill="#d9480f">son transmis par le métal (acier) : arrive en premier</text>
<!-- Son transmis par l'air -->
<line x1="100.0" y1="60.0" x2="530.0" y2="60.0" stroke="#1f6f8b" stroke-width="2.2" stroke-dasharray="8 5"/>
<polygon points="540.0,60.0 530.0,64.5 530.0,55.5" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="320.0" y="48.0" font-size="14" text-anchor="middle" fill="#1f6f8b">son transmis par l'air</text>
<!-- Cote de longueur -->
<line x1="90.0" y1="150.0" x2="90.0" y2="212.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="550.0" y1="150.0" x2="550.0" y2="212.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="99.0" y1="205.0" x2="541.0" y2="205.0" stroke="#111" stroke-width="1.5"/>
<polygon points="550.0,205.0 541.0,209.0 541.0,201.0" fill="#111" stroke="#111" stroke-width="1"/>
<polygon points="90.0,205.0 99.0,201.0 99.0,209.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="320.0" y="198.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">L = 102 m</text>
<text x="320.0" y="240.0" font-size="14" text-anchor="middle" fill="#777">écart entre les deux sons entendus : Δt = 0,280 s</text>
</svg>
