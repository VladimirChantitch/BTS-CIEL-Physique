<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Commande d'un relais 12 V par un GPIO de l'ESP32 à travers une résistance de base et un transistor NPN, avec une diode de roue libre en parallèle sur la bobine">
<rect id="fond-blanc" x="0" y="0" width="640" height="400" fill="#ffffff"/>
<!-- Rail +12 V -->
<line x1="300.0" y1="50.0" x2="500.0" y2="50.0" stroke="#111" stroke-width="2"/>
<text x="505.0" y="55.0" font-size="14" fill="#111" font-weight="bold">+12 V</text>
<!-- ESP32 et résistance de base -->
<rect x="20.0" y="225.0" width="110.0" height="70.0" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="75.0" y="255.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">ESP32</text>
<text x="75.0" y="276.0" font-size="13" text-anchor="middle" fill="#111">GPIO 3,3 V</text>
<line x1="130.0" y1="260.0" x2="165.0" y2="260.0" stroke="#111" stroke-width="2"/>
<rect x="165.0" y="251.0" width="60.0" height="18.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="195.0" y="240.0" font-size="14" text-anchor="middle" fill="#111">R<tspan baseline-shift="sub" font-size="11">B</tspan> = 2,7 kΩ</text>
<line x1="225.0" y1="260.0" x2="312.0" y2="260.0" stroke="#111" stroke-width="2"/>
<!-- Transistor NPN -->
<circle cx="330.0" cy="260.0" r="32.0" fill="none" stroke="#111" stroke-width="1.8"/>
<line x1="312.0" y1="238.0" x2="312.0" y2="282.0" stroke="#111" stroke-width="3"/>
<line x1="312.0" y1="250.0" x2="345.0" y2="230.0" stroke="#111" stroke-width="2"/>
<line x1="345.0" y1="230.0" x2="345.0" y2="190.0" stroke="#111" stroke-width="2"/>
<line x1="312.0" y1="270.0" x2="345.0" y2="290.0" stroke="#111" stroke-width="2"/>
<polygon points="345.0,290.0 333.0,290.0 339.0,281.0" fill="#111" stroke="#111" stroke-width="1"/>
<line x1="345.0" y1="290.0" x2="345.0" y2="340.0" stroke="#111" stroke-width="2"/>
<line x1="345.0" y1="340.0" x2="345.0" y2="350.0" stroke="#111" stroke-width="2"/>
<line x1="331.0" y1="350.0" x2="359.0" y2="350.0" stroke="#111" stroke-width="2"/>
<line x1="336.0" y1="355.0" x2="354.0" y2="355.0" stroke="#111" stroke-width="2"/>
<line x1="341.0" y1="360.0" x2="349.0" y2="360.0" stroke="#111" stroke-width="2"/>
<text x="372.0" y="266.0" font-size="13" fill="#111">T (NPN)</text>
<line x1="75.0" y1="295.0" x2="75.0" y2="340.0" stroke="#111" stroke-width="2"/>
<line x1="75.0" y1="340.0" x2="75.0" y2="350.0" stroke="#111" stroke-width="2"/>
<line x1="61.0" y1="350.0" x2="89.0" y2="350.0" stroke="#111" stroke-width="2"/>
<line x1="66.0" y1="355.0" x2="84.0" y2="355.0" stroke="#111" stroke-width="2"/>
<line x1="71.0" y1="360.0" x2="79.0" y2="360.0" stroke="#111" stroke-width="2"/>
<!-- Bobine du relais -->
<line x1="345.0" y1="50.0" x2="345.0" y2="95.0" stroke="#111" stroke-width="2"/>
<rect x="325.0" y="95.0" width="40.0" height="75.0" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<line x1="345.0" y1="170.0" x2="345.0" y2="190.0" stroke="#111" stroke-width="2"/>
<circle cx="345.0" cy="190.0" r="3.0" fill="#111" stroke="#111" stroke-width="1"/>
<circle cx="345.0" cy="72.0" r="3.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="318.0" y="115.0" font-size="13" text-anchor="end" fill="#111">bobine</text>
<text x="318.0" y="133.0" font-size="13" text-anchor="end" fill="#111">400 Ω</text>
<text x="318.0" y="151.0" font-size="13" text-anchor="end" fill="#111">0,20 H</text>
<!-- Diode de roue libre, cathode côté +12 V -->
<line x1="345.0" y1="72.0" x2="440.0" y2="72.0" stroke="#111" stroke-width="2"/>
<line x1="440.0" y1="72.0" x2="440.0" y2="110.0" stroke="#111" stroke-width="2"/>
<polygon points="440.0,110.0 428.0,134.0 452.0,134.0" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<line x1="426.0" y1="110.0" x2="454.0" y2="110.0" stroke="#1f6f8b" stroke-width="2.5"/>
<line x1="440.0" y1="134.0" x2="440.0" y2="190.0" stroke="#111" stroke-width="2"/>
<line x1="440.0" y1="190.0" x2="345.0" y2="190.0" stroke="#111" stroke-width="2"/>
<text x="458.0" y="128.0" font-size="14" fill="#1f6f8b" font-weight="bold">D<tspan baseline-shift="sub" font-size="11">RL</tspan></text>
<!-- Contact du relais -->
<line x1="365.0" y1="160.0" x2="520.0" y2="160.0" stroke="#777" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="520.0" y="133.0" width="105.0" height="55.0" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="1.5"/>
<text x="572.0" y="156.0" font-size="13" text-anchor="middle" fill="#111">contact</text>
<text x="572.0" y="174.0" font-size="13" text-anchor="middle" fill="#111">du relais</text>
<text x="572.0" y="210.0" font-size="12" text-anchor="middle" fill="#777">vers l'équipement</text>
<text x="572.0" y="226.0" font-size="12" text-anchor="middle" fill="#777">à redémarrer</text>
</svg>
