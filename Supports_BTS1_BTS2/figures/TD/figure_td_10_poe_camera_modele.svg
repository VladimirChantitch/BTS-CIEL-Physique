<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 320" width="710" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Modèle électrique de l'alimentation PoE : port du switch (source 48,0 V), résistance de boucle Rb du câble et caméra IP en série">
<rect id="fond-blanc" x="0" y="0" width="710" height="320" fill="#ffffff"/>
<!-- Cadre du switch PoE -->
<rect x="20.0" y="45.0" width="190.0" height="245.0" rx="6" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="115.0" y="36.0" font-size="14" text-anchor="middle" fill="#777">Switch PoE (un port)</text>
<!-- Source du port : U_PSE = 48,0 V -->
<line x1="140.0" y1="164.0" x2="180.0" y2="164.0" stroke="#111" stroke-width="2"/>
<line x1="150.0" y1="176.0" x2="170.0" y2="176.0" stroke="#111" stroke-width="4"/>
<text x="186.0" y="162.0" font-size="14" fill="#111">+</text>
<text x="178.0" y="188.0" font-size="14" fill="#111">−</text>
<line x1="160.0" y1="85.0" x2="160.0" y2="164.0" stroke="#111" stroke-width="2"/>
<line x1="160.0" y1="176.0" x2="160.0" y2="255.0" stroke="#111" stroke-width="2"/>
<line x1="115.0" y1="225.0" x2="115.0" y2="125.0" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="115.0,115.0 119.5,125.0 110.5,125.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="107.0" y="166.0" font-size="15" text-anchor="end" fill="#d9480f">U<tspan baseline-shift="sub" font-size="11">PSE</tspan></text>
<text x="107.0" y="186.0" font-size="15" text-anchor="end" fill="#d9480f">48,0 V</text>
<!-- Cadre du câble Cat 5e -->
<rect x="250.0" y="45.0" width="190.0" height="245.0" rx="6" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="345.0" y="36.0" font-size="14" text-anchor="middle" fill="#777">Câble Cat 5e (80 m)</text>
<!-- Résistance de boucle Rb sur le fil du haut -->
<line x1="160.0" y1="85.0" x2="315.0" y2="85.0" stroke="#111" stroke-width="2"/>
<rect x="315.0" y="75.0" width="60.0" height="20.0" fill="none" stroke="#111" stroke-width="2"/>
<line x1="375.0" y1="85.0" x2="570.0" y2="85.0" stroke="#111" stroke-width="2"/>
<text x="345.0" y="70.0" font-size="15" text-anchor="middle" fill="#111">R<tspan baseline-shift="sub" font-size="11">b</tspan></text>
<line x1="375.0" y1="112.0" x2="325.0" y2="112.0" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="315.0,112.0 325.0,107.5 325.0,116.5" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="345.0" y="132.0" font-size="15" text-anchor="middle" fill="#d9480f">U<tspan baseline-shift="sub" font-size="11">Rb</tspan></text>
<text x="345.0" y="195.0" font-size="13" text-anchor="middle" fill="#777">R<tspan baseline-shift="sub" font-size="10">b</tspan> : résistance de la</text>
<text x="345.0" y="213.0" font-size="13" text-anchor="middle" fill="#777">boucle aller + retour</text>
<!-- Courant I -->
<line x1="455.0" y1="73.0" x2="495.0" y2="73.0" stroke="#45700f" stroke-width="2"/>
<polygon points="505.0,73.0 495.0,77.5 495.0,68.5" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="480.0" y="64.0" font-size="14" text-anchor="middle" fill="#45700f" font-weight="bold">I = 0,30 A</text>
<!-- Caméra IP (récepteur) -->
<line x1="570.0" y1="85.0" x2="570.0" y2="125.0" stroke="#111" stroke-width="2"/>
<rect x="525.0" y="125.0" width="90.0" height="90.0" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="570.0" y="165.0" font-size="15" text-anchor="middle" fill="#111">Caméra</text>
<text x="570.0" y="184.0" font-size="15" text-anchor="middle" fill="#111">IP</text>
<line x1="570.0" y1="215.0" x2="570.0" y2="255.0" stroke="#111" stroke-width="2"/>
<line x1="570.0" y1="255.0" x2="160.0" y2="255.0" stroke="#111" stroke-width="2"/>
<line x1="645.0" y1="212.0" x2="645.0" y2="138.0" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="645.0,128.0 649.5,138.0 640.5,138.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="655.0" y="175.0" font-size="15" fill="#d9480f">U<tspan baseline-shift="sub" font-size="11">cam</tspan></text>
</svg>
