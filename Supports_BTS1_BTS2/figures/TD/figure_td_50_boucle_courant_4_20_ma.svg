<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Boucle de courant 4-20 mA : alimentation 24 V, capteur de pression, 300 m de câble, résistance de mesure de 150 ohms dont la tension est lue par le CAN de l'ESP32">
<rect id="fond-blanc" x="0" y="0" width="660" height="330" fill="#ffffff"/>
<!-- Alimentation 24 V, borne moins à la masse -->
<circle cx="80.0" cy="165.0" r="28.0" fill="none" stroke="#111" stroke-width="2"/>
<text x="80.0" y="160.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">+</text>
<text x="80.0" y="182.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">−</text>
<text x="40.0" y="170.0" font-size="14" text-anchor="end" fill="#111" font-weight="bold">24 V</text>
<line x1="80.0" y1="193.0" x2="80.0" y2="285.0" stroke="#111" stroke-width="2"/>
<line x1="80.0" y1="285.0" x2="80.0" y2="295.0" stroke="#111" stroke-width="2"/>
<line x1="66.0" y1="295.0" x2="94.0" y2="295.0" stroke="#111" stroke-width="2"/>
<line x1="71.0" y1="300.0" x2="89.0" y2="300.0" stroke="#111" stroke-width="2"/>
<line x1="76.0" y1="305.0" x2="84.0" y2="305.0" stroke="#111" stroke-width="2"/>
<!-- Fil aller vers le capteur (câble de 300 m) -->
<line x1="80.0" y1="137.0" x2="80.0" y2="60.0" stroke="#111" stroke-width="2"/>
<line x1="80.0" y1="60.0" x2="550.0" y2="60.0" stroke="#111" stroke-width="2"/>
<rect x="300.0" y="45.0" width="140.0" height="30.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1.2"/>
<text x="370.0" y="100.0" font-size="12" text-anchor="middle" fill="#777">câble 300 m (2 conducteurs)</text>
<line x1="170.0" y1="60.0" x2="205.0" y2="60.0" stroke="#d9480f" stroke-width="2"/>
<polygon points="215.0,60.0 205.0,55.5 205.0,64.5" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="192.0" y="50.0" font-size="14" text-anchor="middle" fill="#d9480f" font-weight="bold" font-style="italic">I</text>
<!-- Capteur de pression 4-20 mA -->
<line x1="550.0" y1="60.0" x2="550.0" y2="110.0" stroke="#111" stroke-width="2"/>
<rect x="470.0" y="110.0" width="160.0" height="100.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="550.0" y="136.5" font-size="14" text-anchor="middle" fill="#111">Capteur de</text>
<text x="550.0" y="155.5" font-size="14" text-anchor="middle" fill="#111">pression</text>
<text x="550.0" y="174.5" font-size="14" text-anchor="middle" fill="#111">0 à 10 bar</text>
<text x="550.0" y="193.5" font-size="14" text-anchor="middle" fill="#111">4 à 20 mA</text>
<line x1="550.0" y1="210.0" x2="550.0" y2="240.0" stroke="#111" stroke-width="2"/>
<!-- Fil retour vers la résistance de mesure -->
<line x1="550.0" y1="240.0" x2="230.0" y2="240.0" stroke="#111" stroke-width="2"/>
<rect x="300.0" y="225.0" width="140.0" height="30.0" rx="4" fill="#f4f4f4" stroke="#777" stroke-width="1.2"/>
<line x1="290.0" y1="240.0" x2="260.0" y2="240.0" stroke="#d9480f" stroke-width="2"/>
<polygon points="250.0,240.0 260.0,244.5 260.0,235.5" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<circle cx="230.0" cy="240.0" r="3.0" fill="#111" stroke="#111" stroke-width="1"/>
<!-- Résistance de mesure, reliée à la masse -->
<rect x="221.0" y="245.0" width="18.0" height="45.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="230.0" y1="240.0" x2="230.0" y2="245.0" stroke="#111" stroke-width="2"/>
<line x1="230.0" y1="290.0" x2="230.0" y2="298.0" stroke="#111" stroke-width="2"/>
<line x1="230.0" y1="298.0" x2="230.0" y2="308.0" stroke="#111" stroke-width="2"/>
<line x1="216.0" y1="308.0" x2="244.0" y2="308.0" stroke="#111" stroke-width="2"/>
<line x1="221.0" y1="313.0" x2="239.0" y2="313.0" stroke="#111" stroke-width="2"/>
<line x1="226.0" y1="318.0" x2="234.0" y2="318.0" stroke="#111" stroke-width="2"/>
<text x="214.0" y="272.0" font-size="13" text-anchor="end" fill="#111">R = 150 Ω</text>
<line x1="258.0" y1="292.0" x2="258.0" y2="257.0" stroke="#45700f" stroke-width="1.5"/>
<polygon points="258.0,250.0 255.0,257.0 261.0,257.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="264.0" y="284.0" font-size="14" fill="#45700f" font-weight="bold">U<tspan baseline-shift="sub" font-size="11">R</tspan></text>
<!-- Tension mesurée vers le CAN -->
<line x1="230.0" y1="240.0" x2="230.0" y2="165.0" stroke="#111" stroke-width="2"/>
<line x1="230.0" y1="165.0" x2="280.0" y2="165.0" stroke="#111" stroke-width="2"/>
<rect x="280.0" y="140.0" width="150.0" height="50.0" rx="6" fill="#eef5f8" stroke="#1f6f8b" stroke-width="2"/>
<text x="355.0" y="161.0" font-size="13" text-anchor="middle" fill="#111">CAN de l'ESP32</text>
<text x="355.0" y="179.0" font-size="12" text-anchor="middle" fill="#111">12 bits, 0 à 3,3 V</text>
</svg>
