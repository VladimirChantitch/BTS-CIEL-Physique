<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Passerelle LoRaWAN dans le local technique, câble coaxial de 20 m jusqu'à l'antenne en toiture, capteur dans un regard à 3,0 km">
<rect id="fond-blanc" x="0" y="0" width="780" height="390" fill="#ffffff"/>
<!-- Sol -->
<line x1="0.0" y1="330.0" x2="780.0" y2="330.0" stroke="#555" stroke-width="2"/>
<!-- Bâtiment : deux niveaux, local technique à gauche du rez-de-chaussée -->
<rect x="40.0" y="110.0" width="260.0" height="220.0" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<line x1="40.0" y1="220.0" x2="300.0" y2="220.0" stroke="#111" stroke-width="2"/>
<line x1="170.0" y1="220.0" x2="170.0" y2="330.0" stroke="#111" stroke-width="2"/>
<text x="105.0" y="240.0" font-size="13" text-anchor="middle" fill="#777">local technique</text>
<!-- Passerelle -->
<rect x="60.0" y="270.0" width="85.0" height="40.0" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="102.0" y="295.0" font-size="13" text-anchor="middle" fill="#111">passerelle</text>
<!-- Câble coaxial : passerelle, traversée de mur, gaine verticale, mât -->
<polyline points="145.0,290.0 245.0,290.0 245.0,52.0" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
<rect x="164.0" y="282.0" width="12.0" height="16.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="180.0" y="318.0" font-size="13" fill="#d9480f">traversée de mur</text>
<text x="208.0" y="180.0" font-size="13" text-anchor="middle" fill="#111">câble</text>
<text x="208.0" y="196.0" font-size="13" text-anchor="middle" fill="#111">coaxial</text>
<text x="208.0" y="212.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">20 m</text>
<!-- Mât et antenne en toiture -->
<line x1="255.0" y1="110.0" x2="255.0" y2="52.0" stroke="#111" stroke-width="3"/>
<line x1="245.0" y1="52.0" x2="255.0" y2="52.0" stroke="#555" stroke-width="3"/>
<line x1="255.0" y1="52.0" x2="255.0" y2="14.0" stroke="#111" stroke-width="5" stroke-linecap="round"/>
<text x="240.0" y="30.0" font-size="14" text-anchor="end" fill="#111">antenne 5 dBi</text>
<!-- Ondes et liaison montante (capteur vers passerelle) -->
<path d="M 265.8 19.6 A 18 18 0 0 1 265.8 48.4" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
<path d="M 273.0 10.0 A 30 30 0 0 1 273.0 58.0" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
<path d="M 280.2 0.4 A 42 42 0 0 1 280.2 67.6" fill="none" stroke="#1f6f8b" stroke-width="1.8"/>
<line x1="680.0" y1="335.0" x2="300.0" y2="60.0" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="8 6"/>
<line x1="520.0" y1="219.2" x2="478.1" y2="188.9" stroke="#1f6f8b" stroke-width="2.2"/>
<polygon points="470.0,183.0 480.7,185.2 475.5,192.5" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="530.0" y="180.0" font-size="14" fill="#1f6f8b">liaison montante</text>
<!-- Regard enterré contenant le capteur -->
<rect x="650.0" y="330.0" width="60.0" height="34.0" fill="#e9e9e9" stroke="#111" stroke-width="2"/>
<line x1="644.0" y1="330.0" x2="716.0" y2="330.0" stroke="#111" stroke-width="4"/>
<rect x="668.0" y="342.0" width="24.0" height="14.0" rx="2" fill="#45700f" stroke="#111" stroke-width="1"/>
<text x="695.0" y="240.0" font-size="14" text-anchor="middle" fill="#111">capteur dans un regard</text>
<text x="695.0" y="258.0" font-size="13" text-anchor="middle" fill="#111">(pertes du regard : 20 dB)</text>
<line x1="695.0" y1="264.0" x2="695.0" y2="326.0" stroke="#777" stroke-width="1"/>
<!-- Distance passerelle-capteur (échelle non respectée) -->
<line x1="255.0" y1="340.0" x2="255.0" y2="378.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="264.0" y1="372.0" x2="631.0" y2="372.0" stroke="#111" stroke-width="1.5"/>
<polygon points="640.0,372.0 631.0,376.0 631.0,368.0" fill="#111" stroke="#111" stroke-width="1"/>
<polygon points="255.0,372.0 264.0,368.0 264.0,376.0" fill="#111" stroke="#111" stroke-width="1"/>
<line x1="442.0" y1="364.0" x2="450.0" y2="380.0" stroke="#111" stroke-width="1.5"/>
<line x1="450.0" y1="364.0" x2="458.0" y2="380.0" stroke="#111" stroke-width="1.5"/>
<text x="380.0" y="364.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">3,0 km</text>
</svg>
