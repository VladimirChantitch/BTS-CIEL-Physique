<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Contrôle des sondes de température placées dans l'entrée d'air d'une baie de serveurs, à côté d'un thermomètre de référence">
<rect id="fond-blanc" x="0" y="0" width="660" height="330" fill="#ffffff"/>
<!-- Air froid aspiré par la face avant de la baie -->
<line x1="30.0" y1="95.0" x2="137.0" y2="95.0" stroke="#1f6f8b" stroke-width="3"/>
<polygon points="150.0,95.0 137.0,101.0 137.0,89.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<line x1="30.0" y1="165.0" x2="137.0" y2="165.0" stroke="#1f6f8b" stroke-width="3"/>
<polygon points="150.0,165.0 137.0,171.0 137.0,159.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<line x1="30.0" y1="235.0" x2="137.0" y2="235.0" stroke="#1f6f8b" stroke-width="3"/>
<polygon points="150.0,235.0 137.0,241.0 137.0,229.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="90.0" y="70.0" font-size="14" text-anchor="middle" fill="#1f6f8b">air froid</text>
<text x="90.0" y="270.0" font-size="14" text-anchor="middle" fill="#1f6f8b">entrée d'air</text>
<!-- Sondes A, B et thermomètre de référence côte à côte dans le flux d'air -->
<line x1="178.0" y1="128.0" x2="240.0" y2="128.0" stroke="#777" stroke-width="1.5"/>
<rect x="166.0" y="110.0" width="24.0" height="36.0" rx="5" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.8"/>
<text x="178.0" y="133.0" font-size="14" text-anchor="middle" fill="#d9480f" font-weight="bold">A</text>
<line x1="178.0" y1="183.0" x2="240.0" y2="183.0" stroke="#777" stroke-width="1.5"/>
<rect x="166.0" y="165.0" width="24.0" height="36.0" rx="5" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.8"/>
<text x="178.0" y="188.0" font-size="14" text-anchor="middle" fill="#d9480f" font-weight="bold">B</text>
<line x1="178.0" y1="238.0" x2="240.0" y2="238.0" stroke="#777" stroke-width="1.5"/>
<rect x="166.0" y="220.0" width="24.0" height="36.0" rx="5" fill="#e9f1e1" stroke="#45700f" stroke-width="1.8"/>
<text x="178.0" y="243.0" font-size="14" text-anchor="middle" fill="#45700f" font-weight="bold">R</text>
<text x="20.0" y="302.0" font-size="13" fill="#d9480f">A, B : sondes à valider</text>
<text x="20.0" y="320.0" font-size="13" fill="#45700f">R : thermomètre de référence</text>
<!-- Baie de serveurs (vue de côté) -->
<rect x="240.0" y="40.0" width="150.0" height="260.0" rx="4" fill="#f4f4f4" stroke="#111" stroke-width="2.5"/>
<rect x="252.0" y="55.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="64.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="81.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="90.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="107.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="116.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="133.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="142.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="159.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="168.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="185.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="194.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="211.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="220.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="237.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="246.0" r="2.5" fill="#45700f" stroke="none"/>
<rect x="252.0" y="263.0" width="126.0" height="18.0" rx="2" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<circle cx="366.0" cy="272.0" r="2.5" fill="#45700f" stroke="none"/>
<text x="315.0" y="32.0" font-size="14" text-anchor="middle" fill="#111">baie de serveurs</text>
<!-- Air chaud rejeté à l'arrière -->
<line x1="395.0" y1="95.0" x2="457.0" y2="95.0" stroke="#d9480f" stroke-width="3"/>
<polygon points="470.0,95.0 457.0,101.0 457.0,89.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<line x1="395.0" y1="165.0" x2="457.0" y2="165.0" stroke="#d9480f" stroke-width="3"/>
<polygon points="470.0,165.0 457.0,171.0 457.0,159.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<line x1="395.0" y1="235.0" x2="457.0" y2="235.0" stroke="#d9480f" stroke-width="3"/>
<polygon points="470.0,235.0 457.0,241.0 457.0,229.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="432.0" y="70.0" font-size="14" text-anchor="middle" fill="#d9480f">air chaud</text>
<!-- Supervision et mesure électrique -->
<rect x="490.0" y="60.0" width="160.0" height="70.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="570.0" y="87.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Supervision</text>
<text x="570.0" y="110.0" font-size="14" text-anchor="middle" fill="#d9480f">alerte si θ ≥ 27 °C</text>
<rect x="490.0" y="180.0" width="160.0" height="90.0" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="570.0" y="205.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Arrivée électrique</text>
<text x="570.0" y="228.0" font-size="14" text-anchor="middle" fill="#111">tension U (voltmètre)</text>
<text x="570.0" y="250.0" font-size="14" text-anchor="middle" fill="#111">courant I (pince)</text>
<line x1="390.0" y1="285.0" x2="570.0" y2="285.0" stroke="#777" stroke-width="2"/>
<line x1="570.0" y1="285.0" x2="570.0" y2="270.0" stroke="#777" stroke-width="2"/>
</svg>
