<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Point d'accès Wi-Fi bibande et ordinateur situé à 20 m, derrière un mur en béton">
<rect id="fond-blanc" x="0" y="0" width="660" height="260" fill="#ffffff"/>
<!-- Point d'accès (PIRE 20 dBm dans les deux bandes) -->
<rect x="40.0" y="110.0" width="64.0" height="26.0" rx="4" fill="#ffffff" stroke="#111" stroke-width="2"/>
<line x1="50.0" y1="110.0" x2="46.0" y2="82.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<line x1="94.0" y1="110.0" x2="98.0" y2="82.0" stroke="#111" stroke-width="3" stroke-linecap="round"/>
<circle cx="58.0" cy="123.0" r="3.0" fill="#45700f" stroke="none"/>
<circle cx="70.0" cy="123.0" r="3.0" fill="#45700f" stroke="none"/>
<text x="72.0" y="160.0" font-size="14" text-anchor="middle" fill="#111">point d'accès</text>
<text x="72.0" y="178.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">PIRE = 20 dBm</text>
<!-- Ondes émises -->
<path d="M 121.0 103.9 A 22 22 0 0 1 121.0 142.1" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<path d="M 129.0 89.9 A 38 38 0 0 1 129.0 156.1" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<path d="M 137.0 76.0 A 54 54 0 0 1 137.0 170.0" fill="none" stroke="#1f6f8b" stroke-width="2"/>
<!-- Mur en béton (hachuré) -->
<rect x="330.0" y="62.0" width="22.0" height="132.0" fill="#d9d9d9" stroke="#111" stroke-width="1.8"/>
<line x1="331.0" y1="80.0" x2="351.0" y2="62.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="94.0" x2="351.0" y2="76.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="108.0" x2="351.0" y2="90.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="122.0" x2="351.0" y2="104.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="136.0" x2="351.0" y2="118.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="150.0" x2="351.0" y2="132.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="164.0" x2="351.0" y2="146.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="178.0" x2="351.0" y2="160.0" stroke="#888" stroke-width="1"/>
<line x1="331.0" y1="192.0" x2="351.0" y2="174.0" stroke="#888" stroke-width="1"/>
<text x="341.0" y="30.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">mur en béton</text>
<text x="341.0" y="49.0" font-size="14" text-anchor="middle" fill="#111">atténuation : 10 dB à 2,4 GHz ; 18 dB à 5,5 GHz</text>
<!-- Ordinateur portable (antenne 0 dBi) -->
<rect x="560.0" y="92.0" width="52.0" height="36.0" rx="2" fill="#eef4f6" stroke="#111" stroke-width="2"/>
<path d="M 548 136 L 624 136 L 616 128 L 556 128 Z" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="586.0" y="160.0" font-size="14" text-anchor="middle" fill="#111">ordinateur</text>
<text x="586.0" y="178.0" font-size="14" text-anchor="middle" fill="#111">antenne 0 dBi</text>
<!-- Distance -->
<line x1="72.0" y1="188.0" x2="72.0" y2="228.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="586.0" y1="188.0" x2="586.0" y2="228.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="81.0" y1="222.0" x2="577.0" y2="222.0" stroke="#111" stroke-width="1.5"/>
<polygon points="586.0,222.0 577.0,226.0 577.0,218.0" fill="#111" stroke="#111" stroke-width="1"/>
<polygon points="72.0,222.0 81.0,218.0 81.0,226.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="470.0" y="214.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">d = 20 m</text>
</svg>
