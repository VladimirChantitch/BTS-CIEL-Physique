<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="820" height="130" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Chaîne de transmission : préamplificateur +8 dB, câble −5 dB, amplificateur de puissance +25 dB, connecteur −0,5 dB">
<rect id="fond-blanc" x="0" y="0" width="820" height="130" fill="#ffffff"/>
<!-- Puissance d'entrée Pe -->
<line x1="15.0" y1="67.0" x2="60.0" y2="67.0" stroke="#111" stroke-width="2"/>
<polygon points="70.0,67.0 60.0,71.5 60.0,62.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="40.0" y="55.0" font-size="15" text-anchor="middle" fill="#111" font-style="italic">P<tspan baseline-shift="sub" font-size="11">e</tspan></text>
<!-- Bloc 1 : Préamplificateur -->
<rect x="70.0" y="30.0" width="150.0" height="74.0" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="145.0" y="60.0" font-size="15" text-anchor="middle" fill="#111">Préamplificateur</text>
<text x="145.0" y="85.0" font-size="16" text-anchor="middle" fill="#d9480f" font-weight="bold">+8 dB</text>
<line x1="220.0" y1="67.0" x2="240.0" y2="67.0" stroke="#111" stroke-width="2"/>
<polygon points="250.0,67.0 240.0,71.5 240.0,62.5" fill="#111" stroke="#111" stroke-width="1"/>
<!-- Bloc 2 : Câble -->
<rect x="250.0" y="30.0" width="150.0" height="74.0" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="325.0" y="60.0" font-size="15" text-anchor="middle" fill="#111">Câble</text>
<text x="325.0" y="85.0" font-size="16" text-anchor="middle" fill="#1f6f8b" font-weight="bold">−5 dB</text>
<line x1="400.0" y1="67.0" x2="420.0" y2="67.0" stroke="#111" stroke-width="2"/>
<polygon points="430.0,67.0 420.0,71.5 420.0,62.5" fill="#111" stroke="#111" stroke-width="1"/>
<!-- Bloc 3 : Ampli de puissance -->
<rect x="430.0" y="30.0" width="150.0" height="74.0" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2"/>
<text x="505.0" y="60.0" font-size="15" text-anchor="middle" fill="#111">Ampli de puissance</text>
<text x="505.0" y="85.0" font-size="16" text-anchor="middle" fill="#d9480f" font-weight="bold">+25 dB</text>
<line x1="580.0" y1="67.0" x2="600.0" y2="67.0" stroke="#111" stroke-width="2"/>
<polygon points="610.0,67.0 600.0,71.5 600.0,62.5" fill="#111" stroke="#111" stroke-width="1"/>
<!-- Bloc 4 : Connecteur -->
<rect x="610.0" y="30.0" width="150.0" height="74.0" rx="8" fill="#ffffff" stroke="#1f6f8b" stroke-width="2"/>
<text x="685.0" y="60.0" font-size="15" text-anchor="middle" fill="#111">Connecteur</text>
<text x="685.0" y="85.0" font-size="16" text-anchor="middle" fill="#1f6f8b" font-weight="bold">−0,5 dB</text>
<!-- Puissance de sortie Ps -->
<line x1="760.0" y1="67.0" x2="795.0" y2="67.0" stroke="#111" stroke-width="2"/>
<polygon points="805.0,67.0 795.0,71.5 795.0,62.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="784.0" y="55.0" font-size="15" text-anchor="middle" fill="#111" font-style="italic">P<tspan baseline-shift="sub" font-size="11">s</tspan></text>
<text x="410.0" y="124.0" font-size="13" text-anchor="middle" fill="#777">gains en orange, pertes en bleu</text>
</svg>
