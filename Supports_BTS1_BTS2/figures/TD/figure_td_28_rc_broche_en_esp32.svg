<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 290" width="650" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Circuit RC de la broche EN d'un ESP32 alimenté par un échelon de 3,3 V">
<rect id="fond-blanc" x="0" y="0" width="650" height="290" fill="#ffffff"/>
<!-- Échelon de 3,3 V à la mise sous tension -->
<circle cx="130.0" cy="150.0" r="20.0" fill="none" stroke="#111" stroke-width="2"/>
<polyline points="119.0,157.0 128.0,157.0 128.0,143.0 141.0,143.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<text x="100.0" y="146.0" font-size="14" text-anchor="end" fill="#111">échelon</text>
<text x="100.0" y="164.0" font-size="14" text-anchor="end" fill="#111">de 3,3 V</text>
<line x1="130.0" y1="130.0" x2="130.0" y2="60.0" stroke="#111" stroke-width="2"/>
<line x1="130.0" y1="170.0" x2="130.0" y2="240.0" stroke="#111" stroke-width="2"/>
<!-- R entre l'alimentation et la broche EN -->
<line x1="130.0" y1="60.0" x2="240.0" y2="60.0" stroke="#111" stroke-width="2"/>
<rect x="240.0" y="50.0" width="60.0" height="20.0" fill="none" stroke="#111" stroke-width="2"/>
<line x1="300.0" y1="60.0" x2="480.0" y2="60.0" stroke="#111" stroke-width="2"/>
<text x="270.0" y="42.0" font-size="15" text-anchor="middle" fill="#111">R = 10 kΩ</text>
<!-- C entre EN et la masse -->
<circle cx="360.0" cy="60.0" r="3.5" fill="#111" stroke="none"/>
<line x1="360.0" y1="60.0" x2="360.0" y2="145.0" stroke="#111" stroke-width="2"/>
<line x1="342.0" y1="145.0" x2="378.0" y2="145.0" stroke="#111" stroke-width="3"/>
<line x1="342.0" y1="155.0" x2="378.0" y2="155.0" stroke="#111" stroke-width="3"/>
<line x1="360.0" y1="155.0" x2="360.0" y2="240.0" stroke="#111" stroke-width="2"/>
<text x="337.0" y="155.0" font-size="15" text-anchor="end" fill="#111">C = 1,0 µF</text>
<line x1="130.0" y1="240.0" x2="550.0" y2="240.0" stroke="#111" stroke-width="2"/>
<circle cx="360.0" cy="240.0" r="3.5" fill="#111" stroke="none"/>
<!-- Tension de la broche EN -->
<line x1="400.0" y1="228.0" x2="400.0" y2="82.0" stroke="#1f6f8b" stroke-width="2.5"/>
<polygon points="400.0,72.0 404.5,82.0 395.5,82.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="410.0" y="155.0" font-size="15" fill="#1f6f8b" font-weight="bold">u(t)</text>
<!-- Microcontrôleur ESP32 -->
<rect x="480.0" y="30.0" width="140.0" height="100.0" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="550.0" y="90.0" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">ESP32</text>
<text x="488.0" y="65.0" font-size="13" fill="#111">EN</text>
<text x="550.0" y="124.0" font-size="13" text-anchor="middle" fill="#111">GND</text>
<line x1="550.0" y1="130.0" x2="550.0" y2="240.0" stroke="#111" stroke-width="2"/>
<circle cx="550.0" cy="240.0" r="3.5" fill="#111" stroke="none"/>
<line x1="450.0" y1="240.0" x2="450.0" y2="252.0" stroke="#111" stroke-width="2"/>
<line x1="436.0" y1="252.0" x2="464.0" y2="252.0" stroke="#111" stroke-width="2"/>
<line x1="441.0" y1="257.0" x2="459.0" y2="257.0" stroke="#111" stroke-width="2"/>
<line x1="446.0" y1="262.0" x2="454.0" y2="262.0" stroke="#111" stroke-width="2"/>
<circle cx="450.0" cy="240.0" r="3.5" fill="#111" stroke="none"/>
</svg>
