<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Réfraction d'un rayon passant de l'air dans un verre d'indice 1,50 sous une incidence de 30°">
<rect id="fond-blanc" x="0" y="0" width="480" height="340" fill="#ffffff"/>
<!-- Milieux : air au-dessus, verre au-dessous -->
<rect x="40.0" y="170.0" width="400.0" height="140.0" fill="#e3eef2" stroke="none"/>
<line x1="40.0" y1="170.0" x2="440.0" y2="170.0" stroke="#111" stroke-width="2"/>
<text x="50.0" y="50.0" font-size="15" fill="#111">air : n<tspan baseline-shift="sub" font-size="11">1</tspan> = 1,00</text>
<text x="50.0" y="296.0" font-size="15" fill="#111">verre : n<tspan baseline-shift="sub" font-size="11">2</tspan> = 1,50</text>
<!-- Normale au point d'incidence -->
<line x1="240.0" y1="40.0" x2="240.0" y2="305.0" stroke="#777" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="246.0" y="50.0" font-size="13" fill="#777">normale</text>
<!-- Rayon incident (30° par rapport à la normale) -->
<line x1="172.5" y1="53.1" x2="240.0" y2="170.0" stroke="#d9480f" stroke-width="2.5"/>
<line x1="202.3" y1="104.6" x2="203.3" y2="106.3" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="209.3,116.7 198.1,109.3 208.4,103.3" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<!-- Rayon réfracté (angle tracé à sa vraie valeur) -->
<line x1="240.0" y1="170.0" x2="285.0" y2="297.3" stroke="#d9480f" stroke-width="2.5"/>
<line x1="259.8" y1="226.1" x2="260.5" y2="228.0" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="264.5,239.3 254.8,230.0 266.2,226.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<!-- Angles -->
<path d="M 240.0 115.0 A 55 55 0 0 0 212.5 122.4" fill="none" stroke="#111" stroke-width="1.6"/>
<text x="221.0" y="103.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">30°</text>
<path d="M 240.0 225.0 A 55 55 0 0 0 258.3 221.9" fill="none" stroke="#111" stroke-width="1.6"/>
<text x="282.0" y="240.0" font-size="15" fill="#111" font-weight="bold">θ<tspan baseline-shift="sub" font-size="11">2</tspan> = ?</text>
</svg>
