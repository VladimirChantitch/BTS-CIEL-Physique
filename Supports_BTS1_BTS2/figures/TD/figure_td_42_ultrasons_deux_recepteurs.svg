<rect x="600.0" y="35.0" width="140.0" height="90.0" rx="6" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="670.0" y="62.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">oscilloscope</text>
<text x="670.0" y="84.0" font-size="12" text-anchor="middle" fill="#111">voie 1 : R₁</text>
<text x="670.0" y="102.0" font-size="12" text-anchor="middle" fill="#111">voie 2 : R₂</text>
<text x="380.0" y="296.0" font-size="12" text-anchor="middle" fill="#777">émetteur et récepteurs alignés sur le même axe</text>
