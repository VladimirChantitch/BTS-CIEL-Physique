<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 295" width="780" height="295" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Préamplificateur de microphone : source eg de résistance interne Rg, montage inverseur R1, R2, sortie vers le CAN de l'ESP32">
<rect id="fond-blanc" x="0" y="0" width="780" height="295" fill="#ffffff"/>
<!-- Microphone : générateur eg en série avec Rg -->
<rect x="15.0" y="30.0" width="165.0" height="250.0" rx="6" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="97.0" y="22.0" font-size="14" text-anchor="middle" fill="#777">microphone</text>
<circle cx="55.0" cy="160.0" r="20.0" fill="none" stroke="#111" stroke-width="2"/>
<path d="M 44.0 160.0 q 5.5 -9 11 0 t 11 0" fill="none" stroke="#111" stroke-width="2"/>
<text x="82.0" y="165.0" font-size="15" fill="#111">e<tspan baseline-shift="sub" font-size="11">g</tspan></text>
<line x1="55.0" y1="140.0" x2="55.0" y2="70.0" stroke="#111" stroke-width="2"/>
<line x1="55.0" y1="180.0" x2="55.0" y2="250.0" stroke="#111" stroke-width="2"/>
<line x1="55.0" y1="70.0" x2="95.0" y2="70.0" stroke="#111" stroke-width="2"/>
<rect x="95.0" y="60.0" width="60.0" height="20.0" fill="none" stroke="#111" stroke-width="2"/>
<text x="125.0" y="48.0" font-size="14" text-anchor="middle" fill="#111">R<tspan baseline-shift="sub" font-size="11">g</tspan> = 2,2 kΩ</text>
<line x1="155.0" y1="70.0" x2="240.0" y2="70.0" stroke="#111" stroke-width="2"/>
<!-- Entrée de l'amplificateur et tension ve -->
<line x1="240.0" y1="70.0" x2="240.0" y2="130.0" stroke="#111" stroke-width="2"/>
<circle cx="240.0" cy="130.0" r="3.5" fill="#111" stroke="none"/>
<line x1="212.0" y1="242.0" x2="212.0" y2="88.0" stroke="#d9480f" stroke-width="2.5"/>
<polygon points="212.0,78.0 216.5,88.0 207.5,88.0" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
<text x="206.0" y="165.0" font-size="15" text-anchor="end" fill="#d9480f" font-weight="bold">v<tspan baseline-shift="sub" font-size="11">e</tspan></text>
<!-- Montage inverseur : R1, R2 et AOP -->
<line x1="240.0" y1="130.0" x2="270.0" y2="130.0" stroke="#111" stroke-width="2"/>
<rect x="270.0" y="120.0" width="60.0" height="20.0" fill="none" stroke="#111" stroke-width="2"/>
<text x="300.0" y="112.0" font-size="15" text-anchor="middle" fill="#111">R<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<polygon points="410.0,100.0 410.0,220.0 512.0,160.0" fill="#ffffff" stroke="#111" stroke-width="2"/>
<text x="418.0" y="136.0" font-size="18" fill="#111" font-weight="bold">−</text>
<text x="418.0" y="196.0" font-size="18" fill="#111" font-weight="bold">+</text>
<text x="455.6" y="166.0" font-size="18" fill="#111">∞</text>
<line x1="330.0" y1="130.0" x2="410.0" y2="130.0" stroke="#111" stroke-width="2"/>
<circle cx="370.0" cy="130.0" r="3.5" fill="#111" stroke="none"/>
<polyline points="370.0,130.0 370.0,50.0 430.0,50.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<rect x="430.0" y="40.0" width="60.0" height="20.0" fill="none" stroke="#111" stroke-width="2"/>
<text x="460.0" y="32.0" font-size="15" text-anchor="middle" fill="#111">R<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<polyline points="490.0,50.0 570.0,50.0 570.0,160.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<line x1="512.0" y1="160.0" x2="630.0" y2="160.0" stroke="#111" stroke-width="2"/>
<circle cx="570.0" cy="160.0" r="3.5" fill="#111" stroke="none"/>
<circle cx="634.5" cy="160.0" r="4.5" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
<!-- Entrée non inverseuse et masse commune -->
<polyline points="410.0,190.0 390.0,190.0 390.0,250.0" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
<line x1="55.0" y1="250.0" x2="630.0" y2="250.0" stroke="#111" stroke-width="2"/>
<circle cx="390.0" cy="250.0" r="3.5" fill="#111" stroke="none"/>
<circle cx="490.0" cy="250.0" r="3.5" fill="#111" stroke="none"/>
<line x1="490.0" y1="250.0" x2="490.0" y2="262.0" stroke="#111" stroke-width="2"/>
<line x1="476.0" y1="262.0" x2="504.0" y2="262.0" stroke="#111" stroke-width="2"/>
<line x1="481.0" y1="267.0" x2="499.0" y2="267.0" stroke="#111" stroke-width="2"/>
<line x1="486.0" y1="272.0" x2="494.0" y2="272.0" stroke="#111" stroke-width="2"/>
<circle cx="634.5" cy="250.0" r="4.5" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
<!-- Sortie s vers le CAN -->
<line x1="656.0" y1="242.0" x2="656.0" y2="178.0" stroke="#1f6f8b" stroke-width="2.5"/>
<polygon points="656.0,168.0 660.5,178.0 651.5,178.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="666.0" y="210.0" font-size="16" fill="#1f6f8b" font-weight="bold" font-style="italic">s</text>
<text x="700.0" y="120.0" font-size="14" text-anchor="middle" fill="#111">vers le CAN</text>
<text x="700.0" y="138.0" font-size="14" text-anchor="middle" fill="#111">de l'ESP32</text>
</svg>
