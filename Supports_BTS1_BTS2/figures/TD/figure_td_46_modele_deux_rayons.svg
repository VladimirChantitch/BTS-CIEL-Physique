<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Modèle à deux rayons : antenne d'émission à la hauteur h1, terminal à la hauteur h2, distance d, trajet direct et trajet réfléchi sur le sol, image de l'antenne sous le sol">
<rect id="fond-blanc" x="0" y="0" width="640" height="360" fill="#ffffff"/>
<!-- Sol -->
<rect x="30.0" y="220.0" width="580.0" height="110.0" fill="#f4f4f4" stroke="none" stroke-width="2"/>
<line x1="30.0" y1="220.0" x2="610.0" y2="220.0" stroke="#111" stroke-width="2.5"/>
<text x="600.0" y="240.0" font-size="13" text-anchor="end" fill="#111">sol</text>
<!-- Mât et terminal -->
<line x1="90.0" y1="220.0" x2="90.0" y2="90.0" stroke="#111" stroke-width="3"/>
<circle cx="90.0" cy="90.0" r="5.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="80.0" y="80.0" font-size="13" text-anchor="middle" fill="#111">point d'accès</text>
<line x1="550.0" y1="220.0" x2="550.0" y2="165.0" stroke="#111" stroke-width="3"/>
<circle cx="550.0" cy="165.0" r="5.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="554.0" y="153.0" font-size="13" text-anchor="middle" fill="#111">terminal</text>
<line x1="60.0" y1="211.0" x2="60.0" y2="99.0" stroke="#45700f" stroke-width="1.5"/>
<polygon points="60.0,90.0 56.0,99.0 64.0,99.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<polygon points="60.0,220.0 56.0,211.0 64.0,211.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="52.0" y="160.0" font-size="14" text-anchor="end" fill="#45700f" font-weight="bold">h<tspan baseline-shift="sub" font-size="11">1</tspan></text>
<line x1="578.0" y1="211.0" x2="578.0" y2="174.0" stroke="#45700f" stroke-width="1.5"/>
<polygon points="578.0,165.0 574.0,174.0 582.0,174.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<polygon points="578.0,220.0 574.0,211.0 582.0,211.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="586.0" y="197.5" font-size="14" fill="#45700f" font-weight="bold">h<tspan baseline-shift="sub" font-size="11">2</tspan></text>
<!-- Trajet direct -->
<line x1="90.0" y1="90.0" x2="550.0" y2="165.0" stroke="#1f6f8b" stroke-width="2.2"/>
<text x="330.0" y="115.5" font-size="14" text-anchor="middle" fill="#1f6f8b">trajet direct</text>
<!-- Trajet réfléchi -->
<line x1="90.0" y1="90.0" x2="413.2" y2="220.0" stroke="#d9480f" stroke-width="2.2"/>
<line x1="413.2" y1="220.0" x2="550.0" y2="165.0" stroke="#d9480f" stroke-width="2.2"/>
<text x="373.2" y="190.0" font-size="14" text-anchor="end" fill="#d9480f">trajet réfléchi</text>
<!-- Image de l'antenne (symétrique par rapport au sol) -->
<line x1="90.0" y1="220.0" x2="90.0" y2="350.0" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="90.0" cy="350.0" r="5.0" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
<line x1="90.0" y1="350.0" x2="413.2" y2="220.0" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="102.0" y="355.0" font-size="12" fill="#777">image de l'antenne</text>
<!-- Distance d -->
<line x1="90.0" y1="30.0" x2="90.0" y2="68.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="550.0" y1="30.0" x2="550.0" y2="143.0" stroke="#777" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="99.0" y1="30.0" x2="541.0" y2="30.0" stroke="#111" stroke-width="1.5"/>
<polygon points="550.0,30.0 541.0,26.0 541.0,34.0" fill="#111" stroke="#111" stroke-width="1"/>
<polygon points="90.0,30.0 99.0,26.0 99.0,34.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="320.0" y="24.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold" font-style="italic">d</text>
</svg>
