<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Schéma-bloc de la régulation de vitesse : consigne de vitesse, ESP32 (comparateur et correcteur), signal PWM, ventilateur, vitesse, signal tachymétrique compté par l'ESP32">
<rect id="fond-blanc" x="0" y="0" width="880" height="300" fill="#ffffff"/>
<!-- Cadre ESP32 -->
<rect x="85.0" y="40.0" width="300.0" height="225.0" rx="8" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="235.0" y="32.0" font-size="13" text-anchor="middle" fill="#777">programme de l'ESP32</text>
<!-- Consigne et comparateur -->
<line x1="10.0" y1="120.0" x2="94.0" y2="120.0" stroke="#111" stroke-width="2"/>
<polygon points="104.0,120.0 94.0,115.5 94.0,124.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="12.0" y="108.0" font-size="14" fill="#111" font-weight="bold">consigne Ω</text>
<text x="12.0" y="142.0" font-size="12" fill="#777">2000 tr/min</text>
<circle cx="120.0" cy="120.0" r="16.0" fill="none" stroke="#111" stroke-width="2"/>
<line x1="108.7" y1="108.7" x2="131.3" y2="131.3" stroke="#111" stroke-width="2"/>
<line x1="108.7" y1="131.3" x2="131.3" y2="108.7" stroke="#111" stroke-width="2"/>
<text x="100.0" y="102.0" font-size="16" fill="#111" font-weight="bold">+</text>
<text x="103.0" y="156.0" font-size="18" fill="#111" font-weight="bold">−</text>
<line x1="136.0" y1="120.0" x2="170.0" y2="120.0" stroke="#111" stroke-width="2"/>
<polygon points="180.0,120.0 170.0,115.5 170.0,124.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="158.0" y="110.0" font-size="15" text-anchor="middle" fill="#d9480f">ε</text>
<rect x="180.0" y="90.0" width="120.0" height="60.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="240.0" y="116.0" font-size="14" text-anchor="middle" fill="#111">Correcteur</text>
<text x="240.0" y="134.0" font-size="14" text-anchor="middle" fill="#111">α = K × ε</text>
<line x1="300.0" y1="120.0" x2="490.0" y2="120.0" stroke="#111" stroke-width="2"/>
<polygon points="500.0,120.0 490.0,115.5 490.0,124.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="445.0" y="96.0" font-size="12" text-anchor="middle" fill="#777">rapport cyclique α</text>
<text x="445.0" y="111.0" font-size="12" text-anchor="middle" fill="#777">PWM 25 kHz</text>
<rect x="500.0" y="90.0" width="150.0" height="60.0" rx="8" fill="#fdf1ea" stroke="#d9480f" stroke-width="2"/>
<text x="575.0" y="116.0" font-size="14" text-anchor="middle" fill="#111">Ventilateur</text>
<text x="575.0" y="134.0" font-size="14" text-anchor="middle" fill="#111">12 V, 4 fils</text>
<line x1="575.0" y1="45.0" x2="575.0" y2="80.0" stroke="#45700f" stroke-width="1.6"/>
<polygon points="575.0,90.0 579.5,80.0 570.5,80.0" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="583.0" y="58.0" font-size="12" fill="#45700f">perturbation :</text>
<text x="583.0" y="73.0" font-size="12" fill="#45700f">encrassement</text>
<line x1="650.0" y1="120.0" x2="850.0" y2="120.0" stroke="#111" stroke-width="2"/>
<polygon points="860.0,120.0 850.0,115.5 850.0,124.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="855.0" y="108.0" font-size="14" text-anchor="end" fill="#111" font-weight="bold">vitesse Ω</text>
<!-- Retour : tachymètre et comptage -->
<line x1="760.0" y1="120.0" x2="760.0" y2="190.0" stroke="#111" stroke-width="2"/>
<circle cx="760.0" cy="120.0" r="3.0" fill="#111" stroke="#111" stroke-width="1"/>
<rect x="680.0" y="190.0" width="160.0" height="60.0" rx="8" fill="#eef5f8" stroke="#1f6f8b" stroke-width="2"/>
<text x="760.0" y="216.0" font-size="14" text-anchor="middle" fill="#111">Tachymètre</text>
<text x="760.0" y="234.0" font-size="14" text-anchor="middle" fill="#111">2 impulsions par tour</text>
<line x1="680.0" y1="220.0" x2="370.0" y2="220.0" stroke="#111" stroke-width="2"/>
<polygon points="360.0,220.0 370.0,224.5 370.0,215.5" fill="#111" stroke="#111" stroke-width="1"/>
<text x="520.0" y="210.0" font-size="12" text-anchor="middle" fill="#777">impulsions</text>
<rect x="200.0" y="190.0" width="160.0" height="60.0" rx="8" fill="#eef5f8" stroke="#1f6f8b" stroke-width="2"/>
<text x="280.0" y="216.0" font-size="14" text-anchor="middle" fill="#111">Comptage des</text>
<text x="280.0" y="234.0" font-size="14" text-anchor="middle" fill="#111">impulsions</text>
<line x1="200.0" y1="220.0" x2="120.0" y2="220.0" stroke="#111" stroke-width="2"/>
<line x1="120.0" y1="220.0" x2="120.0" y2="146.0" stroke="#111" stroke-width="2"/>
<polygon points="120.0,136.0 115.5,146.0 124.5,146.0" fill="#111" stroke="#111" stroke-width="1"/>
<text x="126.0" y="180.0" font-size="12" fill="#777">mesure</text>
</svg>
