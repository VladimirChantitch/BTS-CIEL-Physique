<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Architecture FTTH GPON : OLT au NRO, 6,5 km de fibre jusqu'au point de mutualisation (coupleur 1 vers 8), 1,2 km jusqu'au point de branchement (coupleur 1 vers 4), 0,3 km jusqu'à la prise terminale, puis la box (ONT) de l'abonné">
<rect id="fond-blanc" x="0" y="0" width="900" height="260" fill="#ffffff"/>
<rect x="15.0" y="80.0" width="120.0" height="80.0" rx="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="75.0" y="116.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">NRO</text>
<text x="75.0" y="134.0" font-size="14" text-anchor="middle" fill="#111">OLT</text>
<!-- Fibre de transport 6,5 km -->
<line x1="135.0" y1="120.0" x2="300.0" y2="120.0" stroke="#d9480f" stroke-width="3"/>
<text x="217.0" y="108.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">6,5 km</text>
<!-- Point de mutualisation : coupleur 1:8 -->
<polygon points="300.0,120.0 360.0,85.0 360.0,155.0" fill="#eef5f8" stroke="#1f6f8b" stroke-width="2"/>
<text x="345.0" y="125.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">1:8</text>
<text x="330.0" y="178.0" font-size="12" text-anchor="middle" fill="#111">point de</text>
<text x="330.0" y="193.0" font-size="12" text-anchor="middle" fill="#111">mutualisation</text>
<line x1="360.0" y1="90.0" x2="395.0" y2="82.0" stroke="#777" stroke-width="1.2"/>
<line x1="360.0" y1="102.0" x2="395.0" y2="94.0" stroke="#777" stroke-width="1.2"/>
<line x1="360.0" y1="114.0" x2="395.0" y2="106.0" stroke="#777" stroke-width="1.2"/>
<line x1="360.0" y1="126.0" x2="395.0" y2="118.0" stroke="#777" stroke-width="1.2"/>
<line x1="360.0" y1="138.0" x2="395.0" y2="130.0" stroke="#777" stroke-width="1.2"/>
<text x="402.0" y="68.0" font-size="11" fill="#777">vers 7 autres</text>
<text x="402.0" y="81.0" font-size="11" fill="#777">branches</text>
<!-- Fibre de distribution 1,2 km -->
<line x1="360.0" y1="148.0" x2="560.0" y2="148.0" stroke="#d9480f" stroke-width="3"/>
<text x="470.0" y="138.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">1,2 km</text>
<!-- Point de branchement : coupleur 1:4 -->
<polygon points="560.0,148.0 610.0,120.0 610.0,176.0" fill="#eef5f8" stroke="#1f6f8b" stroke-width="2"/>
<text x="598.0" y="153.0" font-size="12" text-anchor="middle" fill="#111" font-weight="bold">1:4</text>
<text x="585.0" y="202.0" font-size="12" text-anchor="middle" fill="#111">point de</text>
<text x="585.0" y="217.0" font-size="12" text-anchor="middle" fill="#111">branchement</text>
<line x1="610.0" y1="124.0" x2="640.0" y2="114.0" stroke="#777" stroke-width="1.2"/>
<line x1="610.0" y1="136.0" x2="640.0" y2="126.0" stroke="#777" stroke-width="1.2"/>
<line x1="610.0" y1="148.0" x2="640.0" y2="138.0" stroke="#777" stroke-width="1.2"/>
<!-- Raccordement 0,3 km jusqu'à la prise terminale -->
<line x1="610.0" y1="170.0" x2="740.0" y2="170.0" stroke="#d9480f" stroke-width="3"/>
<text x="675.0" y="160.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">0,3 km</text>
<rect x="740.0" y="155.0" width="30.0" height="30.0" rx="3" fill="#f4f4f4" stroke="#111" stroke-width="1.8"/>
<text x="755.0" y="205.0" font-size="12" text-anchor="middle" fill="#111">prise</text>
<text x="755.0" y="219.0" font-size="12" text-anchor="middle" fill="#111">terminale</text>
<line x1="770.0" y1="170.0" x2="800.0" y2="170.0" stroke="#d9480f" stroke-width="2"/>
<rect x="800.0" y="140.0" width="85.0" height="60.0" rx="8" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="842.5" y="166.0" font-size="15" text-anchor="middle" fill="#111" font-weight="bold">Box</text>
<text x="842.5" y="184.0" font-size="14" text-anchor="middle" fill="#111">(ONT)</text>
<!-- Sens de transmission -->
<line x1="150.0" y1="40.0" x2="310.0" y2="40.0" stroke="#45700f" stroke-width="1.6"/>
<polygon points="320.0,40.0 310.0,35.5 310.0,44.5" fill="#45700f" stroke="#45700f" stroke-width="1"/>
<text x="150.0" y="30.0" font-size="12" fill="#45700f">descendant : 1490 nm</text>
<line x1="320.0" y1="60.0" x2="160.0" y2="60.0" stroke="#1f6f8b" stroke-width="1.6"/>
<polygon points="150.0,60.0 160.0,64.5 160.0,55.5" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="325.0" y="64.0" font-size="12" fill="#1f6f8b">montant : 1310 nm</text>
<text x="450.0" y="250.0" font-size="12" text-anchor="middle" fill="#777">échelle non respectée</text>
</svg>
