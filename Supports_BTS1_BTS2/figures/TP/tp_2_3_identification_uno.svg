<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Identification d'une carte Uno R3 d'origine et d'un clone à puce CH340 : connecteur USB, puce USB, quartz de la puce USB, microcontrôleur ATmega328P, oscillateur du 328P, LED L, régulateur et polyfusible">
<rect id="fond-blanc" x="0" y="0" width="800" height="640" fill="#ffffff"/>

<!-- ===================== Carte 1 : Uno R3 d'origine ===================== -->
<text x="200" y="26" font-size="15" text-anchor="middle" fill="#1f6f8b" font-weight="bold">Uno R3 d'origine</text>
<rect x="40" y="44" width="320" height="250" rx="10" fill="#eaf4f7" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="56" cy="286" r="5" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<circle cx="346" cy="58" r="5" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<circle cx="346" cy="280" r="5" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<!-- connecteurs de broches -->
<rect x="150" y="50" width="185" height="12" fill="#333333"/>
<text x="242" y="76" font-size="9" text-anchor="middle" fill="#555555">AREF GND D13 D12 … D2 D1 D0</text>
<rect x="165" y="276" width="170" height="12" fill="#333333"/>
<text x="250" y="270" font-size="9" text-anchor="middle" fill="#555555">5V GND VIN … A0 A1 A2 A3 A4 A5</text>
<!-- 1 : USB-B -->
<rect x="24" y="74" width="66" height="50" fill="#d6d6d6" stroke="#111" stroke-width="1.5"/>
<rect x="34" y="88" width="40" height="22" fill="#ffffff" stroke="#111" stroke-width="1"/>
<!-- jack -->
<rect x="28" y="214" width="58" height="48" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
<!-- RESET -->
<rect x="48" y="50" width="16" height="16" fill="#bbbbbb" stroke="#111" stroke-width="1"/>
<circle cx="56" cy="58" r="4.5" fill="#888888"/>
<text x="70" y="62" font-size="9" fill="#555555">RESET</text>
<!-- 8 : polyfusible -->
<rect x="98" y="132" width="16" height="9" fill="#e0b84a" stroke="#111" stroke-width="1"/>
<!-- 2 : ATmega16U2 -->
<rect x="120" y="84" width="26" height="26" fill="#2b2b2b"/>
<text x="133" y="100" font-size="7" text-anchor="middle" fill="#ffffff">16U2</text>
<!-- 3 : quartz 16 MHz de la puce USB -->
<rect x="116" y="118" width="36" height="13" rx="6.5" fill="#cfcfcf" stroke="#111" stroke-width="1"/>
<text x="134" y="127.5" font-size="7" text-anchor="middle" fill="#111">16.000</text>
<!-- ICSP de la puce USB -->
<g fill="#555555"><circle cx="164" cy="88" r="2"/><circle cx="171" cy="88" r="2"/><circle cx="178" cy="88" r="2"/><circle cx="164" cy="95" r="2"/><circle cx="171" cy="95" r="2"/><circle cx="178" cy="95" r="2"/></g>
<!-- 6 : LED L, TX, RX et AOP -->
<rect x="200" y="96" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="196" y="101" font-size="9" text-anchor="end" fill="#111">L</text>
<rect x="200" y="108" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="196" y="113" font-size="8" text-anchor="end" fill="#555555">TX</text>
<rect x="200" y="120" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="196" y="125" font-size="8" text-anchor="end" fill="#555555">RX</text>
<rect x="218" y="94" width="16" height="12" fill="#2b2b2b"/>
<text x="226" y="117" font-size="8" text-anchor="middle" fill="#555555">AOP</text>
<!-- LED ON -->
<rect x="306" y="104" width="10" height="5" fill="#3cb44b" stroke="#111" stroke-width="0.8"/>
<text x="320" y="109" font-size="9" fill="#111">ON</text>
<!-- 4 : ATmega328P DIP-28 sur support -->
<rect x="166" y="196" width="168" height="44" fill="#d9d9d9" stroke="#111" stroke-width="1"/>
<rect x="172" y="202" width="156" height="32" fill="#2b2b2b"/>
<text x="250" y="222" font-size="11" text-anchor="middle" fill="#ffffff">ATmega328P</text>
<!-- 5 : résonateur céramique -->
<rect x="196" y="178" width="14" height="7" fill="#d8c79a" stroke="#111" stroke-width="1"/>
<!-- 7 : régulateur 5 V -->
<rect x="101" y="226" width="16" height="6" fill="#2b2b2b"/>
<rect x="98" y="232" width="22" height="16" fill="#2b2b2b"/>
<!-- ICSP du 328P -->
<g fill="#555555"><circle cx="340" cy="176" r="2"/><circle cx="347" cy="176" r="2"/><circle cx="340" cy="183" r="2"/><circle cx="347" cy="183" r="2"/><circle cx="340" cy="190" r="2"/><circle cx="347" cy="190" r="2"/></g>
<text x="343" y="170" font-size="8" text-anchor="middle" fill="#555555">ICSP</text>

<!-- repères numérotés, carte 1 -->
<g stroke="#d9480f" stroke-width="1.2">
<line x1="57" y1="138" x2="57" y2="124"/>
<line x1="133" y1="84" x2="133" y2="70"/>
<line x1="152" y1="128" x2="166" y2="140"/>
<line x1="250" y1="196" x2="262" y2="160"/>
<line x1="203" y1="178" x2="196" y2="164"/>
<line x1="234" y1="100" x2="262" y2="100"/>
<line x1="109" y1="232" x2="109" y2="196"/>
<line x1="106" y1="141" x2="96" y2="158"/>
</g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">
<circle cx="57" cy="147" r="9" fill="#d9480f"/><text x="57" y="151">1</text>
<circle cx="133" cy="62" r="9" fill="#d9480f"/><text x="133" y="66">2</text>
<circle cx="173" cy="146" r="9" fill="#d9480f"/><text x="173" y="150">3</text>
<circle cx="266" cy="152" r="9" fill="#d9480f"/><text x="266" y="156">4</text>
<circle cx="192" cy="157" r="9" fill="#d9480f"/><text x="192" y="161">5</text>
<circle cx="271" cy="100" r="9" fill="#d9480f"/><text x="271" y="104">6</text>
<circle cx="109" cy="188" r="9" fill="#d9480f"/><text x="109" y="192">7</text>
<circle cx="91" cy="166" r="9" fill="#d9480f"/><text x="91" y="170">8</text>
</g>

<!-- ===================== Carte 2 : clone à puce CH340 ===================== -->
<text x="590" y="26" font-size="15" text-anchor="middle" fill="#8a6d00" font-weight="bold">Clone (compatible) à puce CH340</text>
<rect x="430" y="44" width="320" height="250" rx="10" fill="#fff6d5" stroke="#8a6d00" stroke-width="2"/>
<circle cx="446" cy="286" r="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
<circle cx="736" cy="58" r="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
<circle cx="736" cy="280" r="5" fill="#ffffff" stroke="#8a6d00" stroke-width="1.5"/>
<rect x="540" y="50" width="185" height="12" fill="#333333"/>
<text x="632" y="76" font-size="9" text-anchor="middle" fill="#555555">AREF GND D13 D12 … D2 D1 D0</text>
<rect x="555" y="276" width="170" height="12" fill="#333333"/>
<text x="640" y="270" font-size="9" text-anchor="middle" fill="#555555">5V GND VIN … A0 A1 A2 A3 A4 A5</text>
<!-- 1 : USB-B -->
<rect x="414" y="74" width="66" height="50" fill="#d6d6d6" stroke="#111" stroke-width="1.5"/>
<rect x="424" y="88" width="40" height="22" fill="#ffffff" stroke="#111" stroke-width="1"/>
<!-- jack -->
<rect x="418" y="214" width="58" height="48" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
<!-- RESET -->
<rect x="438" y="50" width="16" height="16" fill="#bbbbbb" stroke="#111" stroke-width="1"/>
<circle cx="446" cy="58" r="4.5" fill="#888888"/>
<text x="460" y="62" font-size="9" fill="#555555">RESET</text>
<!-- 8 : polyfusible (selon le modèle) -->
<rect x="488" y="132" width="16" height="9" fill="#e0b84a" stroke="#111" stroke-width="1" stroke-dasharray="3 2"/>
<!-- 2 : CH340G, boîtier à 16 pattes -->
<rect x="508" y="88" width="34" height="16" fill="#2b2b2b"/>
<g stroke="#777777" stroke-width="1.2">
<line x1="511" y1="84" x2="511" y2="88"/><line x1="515" y1="84" x2="515" y2="88"/><line x1="519" y1="84" x2="519" y2="88"/><line x1="523" y1="84" x2="523" y2="88"/><line x1="527" y1="84" x2="527" y2="88"/><line x1="531" y1="84" x2="531" y2="88"/><line x1="535" y1="84" x2="535" y2="88"/><line x1="539" y1="84" x2="539" y2="88"/>
<line x1="511" y1="104" x2="511" y2="108"/><line x1="515" y1="104" x2="515" y2="108"/><line x1="519" y1="104" x2="519" y2="108"/><line x1="523" y1="104" x2="523" y2="108"/><line x1="527" y1="104" x2="527" y2="108"/><line x1="531" y1="104" x2="531" y2="108"/><line x1="535" y1="104" x2="535" y2="108"/><line x1="539" y1="104" x2="539" y2="108"/>
</g>
<text x="525" y="99" font-size="7" text-anchor="middle" fill="#ffffff">CH340</text>
<!-- 3 : quartz 12 MHz de la puce USB -->
<rect x="506" y="118" width="38" height="13" rx="6.5" fill="#cfcfcf" stroke="#111" stroke-width="1"/>
<text x="525" y="127.5" font-size="7" text-anchor="middle" fill="#111">12.000</text>
<!-- 6 : LED L et sa résistance, reliées à D13 -->
<rect x="590" y="96" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="586" y="101" font-size="9" text-anchor="end" fill="#111">L</text>
<rect x="604" y="96" width="9" height="5" fill="#111"/>
<rect x="590" y="108" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="586" y="113" font-size="8" text-anchor="end" fill="#555555">TX</text>
<rect x="590" y="120" width="10" height="5" fill="#f2c200" stroke="#111" stroke-width="0.8"/>
<text x="586" y="125" font-size="8" text-anchor="end" fill="#555555">RX</text>
<!-- LED ON -->
<rect x="696" y="104" width="10" height="5" fill="#3cb44b" stroke="#111" stroke-width="0.8"/>
<text x="710" y="109" font-size="9" fill="#111">ON</text>
<!-- 4 : ATmega328P en boîtier CMS carré -->
<rect x="600" y="192" width="40" height="40" fill="#2b2b2b"/>
<g stroke="#777777" stroke-width="1.2">
<line x1="606" y1="187" x2="606" y2="192"/><line x1="613" y1="187" x2="613" y2="192"/><line x1="620" y1="187" x2="620" y2="192"/><line x1="627" y1="187" x2="627" y2="192"/><line x1="634" y1="187" x2="634" y2="192"/>
<line x1="606" y1="232" x2="606" y2="237"/><line x1="613" y1="232" x2="613" y2="237"/><line x1="620" y1="232" x2="620" y2="237"/><line x1="627" y1="232" x2="627" y2="237"/><line x1="634" y1="232" x2="634" y2="237"/>
<line x1="595" y1="198" x2="600" y2="198"/><line x1="595" y1="205" x2="600" y2="205"/><line x1="595" y1="212" x2="600" y2="212"/><line x1="595" y1="219" x2="600" y2="219"/><line x1="595" y1="226" x2="600" y2="226"/>
<line x1="640" y1="198" x2="645" y2="198"/><line x1="640" y1="205" x2="645" y2="205"/><line x1="640" y1="212" x2="645" y2="212"/><line x1="640" y1="219" x2="645" y2="219"/><line x1="640" y1="226" x2="645" y2="226"/>
</g>
<text x="620" y="215" font-size="8" text-anchor="middle" fill="#ffffff">328P</text>
<!-- 5 : quartz 16 MHz en boîtier métallique -->
<rect x="660" y="205" width="44" height="15" rx="7.5" fill="#cfcfcf" stroke="#111" stroke-width="1"/>
<text x="682" y="215.5" font-size="8" text-anchor="middle" fill="#111">16.000</text>
<!-- 7 : régulateur 5 V -->
<rect x="491" y="226" width="16" height="6" fill="#2b2b2b"/>
<rect x="488" y="232" width="22" height="16" fill="#2b2b2b"/>
<!-- ICSP du 328P -->
<g fill="#555555"><circle cx="730" cy="176" r="2"/><circle cx="737" cy="176" r="2"/><circle cx="730" cy="183" r="2"/><circle cx="737" cy="183" r="2"/><circle cx="730" cy="190" r="2"/><circle cx="737" cy="190" r="2"/></g>
<text x="733" y="170" font-size="8" text-anchor="middle" fill="#555555">ICSP</text>

<!-- repères numérotés, carte 2 -->
<g stroke="#d9480f" stroke-width="1.2">
<line x1="447" y1="138" x2="447" y2="124"/>
<line x1="525" y1="84" x2="525" y2="70"/>
<line x1="544" y1="128" x2="558" y2="140"/>
<line x1="620" y1="192" x2="620" y2="168"/>
<line x1="682" y1="205" x2="682" y2="184"/>
<line x1="613" y1="98" x2="640" y2="98"/>
<line x1="499" y1="232" x2="499" y2="196"/>
<line x1="496" y1="141" x2="486" y2="158"/>
</g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">
<circle cx="447" cy="147" r="9" fill="#d9480f"/><text x="447" y="151">1</text>
<circle cx="525" cy="62" r="9" fill="#d9480f"/><text x="525" y="66">2</text>
<circle cx="565" cy="146" r="9" fill="#d9480f"/><text x="565" y="150">3</text>
<circle cx="620" cy="160" r="9" fill="#d9480f"/><text x="620" y="164">4</text>
<circle cx="682" cy="176" r="9" fill="#d9480f"/><text x="682" y="180">5</text>
<circle cx="649" cy="98" r="9" fill="#d9480f"/><text x="649" y="102">6</text>
<circle cx="499" cy="188" r="9" fill="#d9480f"/><text x="499" y="192">7</text>
<circle cx="481" cy="166" r="9" fill="#d9480f"/><text x="481" y="170">8</text>
</g>

<!-- ===================== Tableau de repérage ===================== -->
<rect x="20" y="318" width="760" height="30" fill="#f4f4f4" stroke="#111" stroke-width="1"/>
<g font-size="12" font-weight="bold" fill="#111">
<text x="36" y="338" text-anchor="middle">n°</text>
<text x="60" y="338">Élément</text>
<text x="262" y="338" fill="#1f6f8b">Uno R3 d'origine</text>
<text x="522" y="338" fill="#8a6d00">Clone à puce CH340</text>
</g>
<g stroke="#bbbbbb" stroke-width="1">
<line x1="20" y1="382" x2="780" y2="382"/>
<line x1="20" y1="416" x2="780" y2="416"/>
<line x1="20" y1="450" x2="780" y2="450"/>
<line x1="20" y1="484" x2="780" y2="484"/>
<line x1="20" y1="518" x2="780" y2="518"/>
<line x1="20" y1="552" x2="780" y2="552"/>
<line x1="20" y1="586" x2="780" y2="586"/>
<line x1="52" y1="318" x2="52" y2="620"/>
<line x1="254" y1="318" x2="254" y2="620"/>
<line x1="514" y1="318" x2="514" y2="620"/>
</g>
<rect x="20" y="318" width="760" height="302" fill="none" stroke="#111" stroke-width="1"/>
<g font-size="11" fill="#111">
<text x="36" y="369" text-anchor="middle" font-weight="bold" fill="#d9480f">1</text>
<text x="60" y="369">Connecteur USB-B</text>
<text x="262" y="369">identique</text>
<text x="522" y="369">identique</text>

<text x="36" y="403" text-anchor="middle" font-weight="bold" fill="#d9480f">2</text>
<text x="60" y="397">Puce USB (convertit l'USB en</text>
<text x="60" y="410">liaison série pour le 328P)</text>
<text x="262" y="397">ATmega16U2 : petit boîtier carré</text>
<text x="262" y="410">près du connecteur USB</text>
<text x="522" y="397">CH340G (16 pattes) ou CH340C ;</text>
<text x="522" y="410">pilote CH340 à installer sur le PC</text>

<text x="36" y="437" text-anchor="middle" font-weight="bold" fill="#d9480f">3</text>
<text x="60" y="437">Quartz de la puce USB</text>
<text x="262" y="437">16 MHz, boîtier métallique ovale</text>
<text x="522" y="431">12 MHz, boîtier métallique ovale</text>
<text x="522" y="444">(absent avec un CH340C)</text>

<text x="36" y="471" text-anchor="middle" font-weight="bold" fill="#d9480f">4</text>
<text x="60" y="471">Microcontrôleur ATmega328P</text>
<text x="262" y="465">boîtier DIP à 28 pattes,</text>
<text x="262" y="478">souvent sur un support</text>
<text x="522" y="465">souvent un boîtier CMS carré,</text>
<text x="522" y="478">parfois DIP sur support</text>

<text x="36" y="505" text-anchor="middle" font-weight="bold" fill="#d9480f">5</text>
<text x="60" y="499">Oscillateur du 328P (16 MHz) :</text>
<text x="60" y="512">il cadence millis() et la liaison série</text>
<text x="262" y="499">résonateur céramique : minuscule</text>
<text x="262" y="512">composant CMS à 3 pattes</text>
<text x="522" y="499">souvent un quartz « 16.000 » en boîtier</text>
<text x="522" y="512">métallique, parfois un résonateur</text>

<text x="36" y="539" text-anchor="middle" font-weight="bold" fill="#d9480f">6</text>
<text x="60" y="539">LED L (reliée à la broche D13)</text>
<text x="262" y="533">commandée par un AOP suiveur</text>
<text x="262" y="546">(petit boîtier à 8 pattes à côté)</text>
<text x="522" y="533">souvent reliée directement à D13</text>
<text x="522" y="546">par une résistance de 1 kΩ</text>

<text x="36" y="573" text-anchor="middle" font-weight="bold" fill="#d9480f">7</text>
<text x="60" y="567">Régulateur 5 V</text>
<text x="60" y="580">(alimentation par le jack)</text>
<text x="262" y="573">boîtier CMS à 4 pattes près du jack</text>
<text x="522" y="573">idem</text>

<text x="36" y="607" text-anchor="middle" font-weight="bold" fill="#d9480f">8</text>
<text x="60" y="601">Polyfusible 500 mA</text>
<text x="60" y="614">(protège le port USB du PC)</text>
<text x="262" y="607">près du connecteur USB</text>
<text x="522" y="601">présent ou non selon le modèle</text>
<text x="522" y="614">(tracé en pointillés)</text>
</g>
</svg>
