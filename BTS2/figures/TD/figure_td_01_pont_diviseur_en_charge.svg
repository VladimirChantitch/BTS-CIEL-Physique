<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Arial, Helvetica, sans-serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#111" stroke-width="2">
    <!-- source E -->
    <line x1="60" y1="60" x2="60" y2="120"/><circle cx="60" cy="150" r="22"/><line x1="60" y1="180" x2="60" y2="240"/>
    <!-- top wire -->
    <line x1="60" y1="60" x2="260" y2="60"/>
    <!-- R1 -->
    <line x1="260" y1="60" x2="260" y2="80"/><rect x="245" y="80" width="30" height="60"/><line x1="260" y1="140" x2="260" y2="160"/>
    <!-- node -->
    <circle cx="260" cy="160" r="4" fill="#111"/>
    <!-- R2 -->
    <line x1="260" y1="160" x2="260" y2="170"/><rect x="245" y="170" width="30" height="60"/><line x1="260" y1="230" x2="260" y2="240"/>
    <!-- bottom wire -->
    <line x1="60" y1="240" x2="420" y2="240"/>
    <!-- Rch dashed branch -->
    <g stroke-dasharray="6 5">
      <line x1="260" y1="160" x2="420" y2="160"/><line x1="420" y1="160" x2="420" y2="170"/><rect x="405" y="170" width="30" height="60"/><line x1="420" y1="230" x2="420" y2="240"/>
    </g>
    <!-- arrow U(R2) -->
    <line x1="330" y1="230" x2="330" y2="180"/><polygon points="330,172 324,184 336,184" fill="#111"/>
  </g>
  <text x="48" y="145" font-size="14">+</text><text x="48" y="168" font-size="14">−</text>
  <text x="20" y="155">E</text>
  <text x="285" y="115">R₁</text>
  <text x="285" y="205">R₂</text>
  <text x="445" y="205">R_ch</text>
  <text x="340" y="210">U(R₂)</text>
  <text x="60" y="280" font-size="13" fill="#555">Charge R_ch (en pointillés) branchée en parallèle sur R₂ : à vide, la branche est absente.</text>
</svg>
