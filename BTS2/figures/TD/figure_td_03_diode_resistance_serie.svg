<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="Arial, Helvetica, sans-serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#111" stroke-width="2">
    <!-- source -->
    <line x1="60" y1="60" x2="60" y2="118"/><circle cx="60" cy="140" r="22"/><line x1="60" y1="162" x2="60" y2="220"/>
    <!-- top wire, R -->
    <line x1="60" y1="60" x2="150" y2="60"/><rect x="150" y="45" width="80" height="30"/><line x1="230" y1="60" x2="320" y2="60"/>
    <!-- diode vertical: anode top, cathode bottom -->
    <line x1="320" y1="60" x2="320" y2="110"/>
    <polygon points="300,110 340,110 320,150" fill="none"/>
    <line x1="300" y1="150" x2="340" y2="150"/>
    <line x1="320" y1="150" x2="320" y2="220"/>
    <!-- LED arrows (optional) -->
    <g stroke-dasharray="3 3"><line x1="345" y1="118" x2="368" y2="100"/><line x1="350" y1="135" x2="373" y2="117"/></g>
    <!-- bottom -->
    <line x1="60" y1="220" x2="320" y2="220"/>
    <!-- current arrow -->
    <line x1="90" y1="45" x2="125" y2="45"/><polygon points="133,45 123,40 123,50" fill="#111"/>
    <!-- U_R arrow -->
    <line x1="150" y1="95" x2="220" y2="95"/><polygon points="228,95 218,90 218,100" fill="#111"/>
    <!-- V_D arrow -->
    <line x1="270" y1="150" x2="270" y2="115"/><polygon points="270,107 264,119 276,119" fill="#111"/>
  </g>
  <text x="48" y="135" font-size="14">+</text><text x="48" y="158" font-size="14">−</text>
  <text x="22" y="145">E</text>
  <text x="185" y="38">R</text>
  <text x="98" y="38">I</text>
  <text x="175" y="118">U_R</text>
  <text x="238" y="135">V_D</text>
  <text x="352" y="180">D (ou LED)</text>
  <text x="60" y="260" font-size="13" fill="#555">Anode en haut, cathode en bas : diode passante si E > V_seuil. Flèches en pointillés = lumière émise (cas d'une LED).</text>
</svg>
