<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="Arial, Helvetica, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#111" stroke-width="2">
    <rect x="30" y="60" width="130" height="70" rx="8"/>
    <rect x="480" y="60" width="130" height="70" rx="8"/>
    <!-- connectors -->
    <rect x="170" y="85" width="16" height="20" fill="#ddd"/><rect x="454" y="85" width="16" height="20" fill="#ddd"/>
    <!-- fibre -->
    <path d="M186 95 C 250 40, 320 150, 454 95" stroke-width="5" stroke="#1f6f8b"/>
    <path d="M186 95 C 250 40, 320 150, 454 95" stroke-width="1.5" stroke="#fff"/>
    <!-- arrows -->
    <line x1="160" y1="95" x2="168" y2="95"/><line x1="470" y1="95" x2="478" y2="95"/>
  </g>
  <text x="95" y="90" text-anchor="middle" font-weight="bold">Émetteur</text>
  <text x="95" y="112" text-anchor="middle" font-size="13">LED ou diode laser</text>
  <text x="545" y="90" text-anchor="middle" font-weight="bold">Récepteur</text>
  <text x="545" y="112" text-anchor="middle" font-size="13">photodiode + ampli</text>
  <text x="320" y="165" text-anchor="middle">Fibre optique : L km, α dB/km, dispersion D ps/(nm·km)</text>
  <text x="178" y="130" text-anchor="middle" font-size="12">0,5 dB</text>
  <text x="462" y="130" text-anchor="middle" font-size="12">0,5 dB</text>
  <text x="95" y="160" text-anchor="middle" font-size="13">P_e (dBm), Δλ</text>
  <text x="545" y="160" text-anchor="middle" font-size="13">sensibilité S_min (dBm)</text>
  <text x="30" y="205" font-size="13" fill="#555">Bilan : P_reçue = P_e − α·L − pertes connecteurs. Étalement d'impulsion : Δt = D · Δλ · L.</text>
</svg>
