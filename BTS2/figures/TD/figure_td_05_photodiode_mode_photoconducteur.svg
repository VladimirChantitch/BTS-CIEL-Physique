<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="Arial, Helvetica, sans-serif" font-size="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#111" stroke-width="2">
    <!-- source -->
    <line x1="60" y1="60" x2="60" y2="118"/><circle cx="60" cy="140" r="22"/><line x1="60" y1="162" x2="60" y2="220"/>
    <!-- top wire -->
    <line x1="60" y1="60" x2="320" y2="60"/>
    <!-- photodiode vertical, REVERSE: cathode top, anode bottom -->
    <line x1="320" y1="60" x2="320" y2="100"/>
    <line x1="300" y1="100" x2="340" y2="100"/>
    <polygon points="300,140 340,140 320,100" fill="none"/>
    <line x1="320" y1="140" x2="320" y2="160"/>
    <!-- incoming light arrows -->
    <line x1="255" y1="90" x2="292" y2="112"/><polygon points="298,116 287,116 292,106" fill="#111"/>
    <line x1="255" y1="112" x2="292" y2="134"/><polygon points="298,138 287,138 292,128" fill="#111"/>
    <!-- R -->
    <rect x="305" y="160" width="30" height="50"/><line x1="320" y1="210" x2="320" y2="220"/>
    <!-- bottom -->
    <line x1="60" y1="220" x2="320" y2="220"/>
    <!-- U_R arrow -->
    <line x1="380" y1="210" x2="380" y2="170"/><polygon points="380,162 374,174 386,174" fill="#111"/>
    <!-- current arrow -->
    <line x1="150" y1="45" x2="185" y2="45"/><polygon points="193,45 183,40 183,50" fill="#111"/>
  </g>
  <text x="48" y="135" font-size="14">+</text><text x="48" y="158" font-size="14">−</text>
  <text x="14" y="145">5 V</text>
  <text x="155" y="38">I (inverse)</text>
  <text x="215" y="90">Φ</text>
  <text x="352" y="125">photodiode</text>
  <text x="345" y="192">R</text>
  <text x="392" y="195">U_R</text>
  <text x="60" y="260" font-size="13" fill="#555">Polarisation inverse (cathode côté +) : I = S × Φ, indépendant de la tension. U_R = R × I (exercice 1.20).</text>
</svg>
