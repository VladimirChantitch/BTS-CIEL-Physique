<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" width="660" height="190" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Onde incidente et onde réfléchie" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect id="fond-blanc" x="0" y="0" width="660" height="190" fill="#ffffff"/>
