<text x="50.0" y="105.0" font-size="13" text-anchor="middle" fill="#111" font-weight="bold">Gén.</text>
<line x1="80.0" y1="82.0" x2="540.0" y2="82.0" stroke="#111" stroke-width="2"/>
<line x1="80.0" y1="118.0" x2="540.0" y2="118.0" stroke="#111" stroke-width="2"/>
<text x="96.0" y="105.0" font-size="12" text-anchor="start" fill="#777">ligne d’impédance caractéristique Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="540.0" y1="82.0" x2="540.0" y2="87.0" stroke="#111" stroke-width="2"/>
