<rect x="533.0" y="87.0" width="14.0" height="26.0" rx="0" fill="none" stroke="#111" stroke-width="2"/>
<text x="556.0" y="105.0" font-size="13" text-anchor="start" fill="#111">R<tspan baseline-shift="sub" font-size="72%">CH</tspan> ≠ Z<tspan baseline-shift="sub" font-size="72%">C</tspan></text>
<line x1="120.0" y1="64.0" x2="472.0" y2="64.0" stroke="#d9480f" stroke-width="2.4"/>
