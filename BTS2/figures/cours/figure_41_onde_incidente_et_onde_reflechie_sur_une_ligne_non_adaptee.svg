<line x1="480.0" y1="136.0" x2="128.0" y2="136.0" stroke="#1f6f8b" stroke-width="2.4"/>
<polygon points="120.0,136.0 128.7,131.0 128.7,141.0" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
<text x="300.0" y="156.0" font-size="12" text-anchor="middle" fill="#1f6f8b">onde réfléchie</text>
<text x="320.0" y="22.0" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">ρ = (R<tspan baseline-shift="sub" font-size="72%">CH</tspan> − Z<tspan baseline-shift="sub" font-size="72%">C</tspan>) / (R<tspan baseline-shift="sub" font-size="72%">CH</tspan> + Z<tspan baseline-shift="sub" font-size="72%">C</tspan>), avec −1 ≤ ρ ≤ +1</text>
</svg>
