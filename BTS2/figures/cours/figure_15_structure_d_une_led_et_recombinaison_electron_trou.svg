<!-- Structure d'une LED et recombinaison électron-trou -->
<!-- Coordonnées : origine en haut à gauche, x vers la droite, y vers le bas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 245" width="480" height="245" font-family="Arial, Helvetica, sans-serif" aria-label="Structure d'une LED et recombinaison électron-trou" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Fond blanc -->
  <rect width="100%" height="100%" fill="white"/>
  <rect x="80" y="60" width="160" height="120" fill="#fbe4d6" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="50" font-size="13" text-anchor="middle" fill="#111">zone P (trous)</text>
  <rect x="240" y="60" width="160" height="120" fill="#c9d8de" stroke="#111" stroke-width="1.5"/>
  <text x="320" y="50" font-size="13" text-anchor="middle" fill="#111">zone N (électrons)</text>
  <line x1="240" y1="60" x2="240" y2="180" stroke="#d9480f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="200" font-size="12" text-anchor="end" fill="#d9480f">jonction</text>
  <circle cx="300" cy="90" r="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="300" y="94" font-size="10" text-anchor="middle" fill="#fff">−</text>
  <circle cx="340" cy="130" r="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="340" y="134" font-size="10" text-anchor="middle" fill="#fff">−</text>
  <circle cx="370" cy="100" r="6" fill="#111" stroke="#111" stroke-width="2"/>
  <text x="370" y="104" font-size="10" text-anchor="middle" fill="#fff">−</text>
  <circle cx="120" cy="100" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="120" y="104" font-size="10" text-anchor="middle" fill="#111">+</text>
  <circle cx="160" cy="140" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="160" y="144" font-size="10" text-anchor="middle" fill="#111">+</text>
  <circle cx="200" cy="90" r="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="94" font-size="10" text-anchor="middle" fill="#111">+</text>
  <line x1="300" y1="90" x2="265.0519270348228" y2="105.53247687341208" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="255,110 263.0212347045556,100.9634191303108 267.08261936509007,110.10153461651336" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <line x1="200" y1="90" x2="222.67201865594404" y2="104.17001165996501" stroke="#1f6f8b" stroke-width="2.5"/>
  <polygon points="232,110 220.02202395592815,108.41000317999045 225.32201335595994,99.93002013993957" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1"/>
  <path d="M245 150 l25 -25" stroke="#d9480f" stroke-width="2"/>
  <path d="M250 165 l25 -25" stroke="#d9480f" stroke-width="2"/>
  <circle cx="240" cy="120" r="10" fill="#fff" stroke="#d9480f" stroke-width="2"/>
  <text x="290" y="205" font-size="12" text-anchor="start" fill="#d9480f">recombinaison → photon</text>
  <line x1="40" y1="120" x2="80" y2="120" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="120" x2="440" y2="120" stroke="#111" stroke-width="2"/>
  <text x="40" y="105" font-size="12" text-anchor="middle" fill="#111">+ (anode)</text>
  <text x="440" y="105" font-size="12" text-anchor="middle" fill="#111">− (cathode)</text>
  <line x1="30" y1="150" x2="59" y2="150" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="70,150 59,155 59,145" fill="#d9480f" stroke="#d9480f" stroke-width="1"/>
  <text x="50" y="168" font-size="13" text-anchor="middle" fill="#d9480f">I</text>
  <text x="240" y="230" font-size="12" text-anchor="middle" fill="#777">Polarisation directe : recombinaison électron-trou → photon</text>
</svg>
