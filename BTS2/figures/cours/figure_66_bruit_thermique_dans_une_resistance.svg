<text x="420.0" y="190.0" font-size="17" text-anchor="middle" fill="#111" font-weight="bold">B<tspan baseline-shift="sub" font-size="72%">eff</tspan> = √(4 k<tspan baseline-shift="sub" font-size="72%">B</tspan> T R Δf)</text>
<text x="420.0" y="214.0" font-size="12" text-anchor="middle" fill="#777">k<tspan baseline-shift="sub" font-size="72%">B</tspan> ≈ 1,38×10⁻²³ J/K · T en kelvin · Δf : bande de mesure</text>
