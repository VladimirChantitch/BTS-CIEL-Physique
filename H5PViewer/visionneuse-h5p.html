html.h5p-iframe, html.h5p-iframe > body {
  font-family: Sans-Serif; /* Use the browser's default sans-serif font. (Since Heletica doesn't look nice on Windows, and Arial on OS X.) */
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}
html.h5p-iframe .h5p-theme,
html.h5p-iframe > body .h5p-theme,
.h5peditor .h5p-theme {
  font-family: var(
    --h5p-theme-font-name
  ); /* Use the browser's default sans-serif font. (Since Heletica doesn't look nice on Windows, and Arial on OS X.) */
}
.h5p-semi-fullscreen, .h5p-fullscreen, html.h5p-iframe .h5p-container {
  overflow: hidden;
}
.h5p-content {
  position: relative;
  background: #fefefe;
  border: 1px solid #EEE;
  border-bottom: none;
  box-sizing: border-box;
  -moz-box-sizing: border-box;
}
.h5p-noselect
{
  -khtml-user-select: none;
  -ms-user-select: none;
  -moz-user-select: none;
  -webkit-user-select: none;
  user-select: none;
}
html.h5p-iframe .h5p-content {
  font-size: 16px;
  line-height: 1.5em;
  width: 100%;
  height: auto;
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
}
html.h5p-iframe .h5p-fullscreen .h5p-content,
html.h5p-iframe .h5p-semi-fullscreen .h5p-content {
  height: 100%;
}
.h5p-content.h5p-no-frame,
.h5p-fullscreen .h5p-content,
.h5p-semi-fullscreen .h5p-content {
  border: 0;
}
.h5p-container {
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.h5p-iframe-wrapper.h5p-fullscreen {
  background-color: #000;
}
body.h5p-semi-fullscreen {
  position: fixed;
  width: 100%;
  height: 100%;
}
.h5p-container.h5p-semi-fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 101;
  width: 100%;
  height: 100%;
  background-color: #FFF;
}

.h5p-content-controls {
  margin: 0;
  position: absolute;
  right: 0;
  top: 0;
  z-index: 3;
}
.h5p-fullscreen .h5p-content-controls {
  display: none;
}

.h5p-content-controls > a:link, .h5p-content-controls > a:visited, a.h5p-disable-fullscreen:link, a.h5p-disable-fullscreen:visited {
  color: #e5eef6;
}

.h5p-theme .h5p-content-controls .h5p-enable-fullscreen:before {
  font-family: 'h5p-theme';
  font-weight: bold;
  content: "\e915";
}
.h5p-theme .h5p-content-controls .h5p-disable-fullscreen:before {
  font-family: 'h5p-theme';
  font-weight: bold;
  content: "\e914";
}
.h5p-theme .h5p-content-controls .h5p-enable-fullscreen, .h5p-theme .h5p-content-controls .h5p-disable-fullscreen {
  cursor: pointer;
  color: #EEE;
  background: rgb(0,0,0);
  background: rgba(0,0,0,0.3);
  font-size: var(--h5p-theme-font-size-m);
  text-indent: 0.04em;
  padding: var(--h5p-theme-spacing-xs);
}

.h5p-theme .h5p-content-controls .h5p-enable-fullscreen:focus-visible, .h5p-theme .h5p-content-controls .h5p-disable-fullscreen:focus-visible {
  outline: 2px ridge var(--h5p-theme-contrast-cta-white);
  border-radius: 4px;
  outline-offset: 2px;
}

.h5p-enable-fullscreen:before {
  font-family: 'H5P';
  content: "\e88c";
}
.h5p-disable-fullscreen:before {
  font-family: 'H5P';
  content: "\e891";
}
.h5p-enable-fullscreen, .h5p-disable-fullscreen {
  cursor: pointer;
  color: #EEE;
  background: rgb(0,0,0);
  background: rgba(0,0,0,0.3);
  line-height: 0.975em;
  font-size: 2em;
  width: 1.125em;
  height: 1em;
  text-indent: 0.04em;
}
.h5p-disable-fullscreen {
  line-height: 0.925em;
  width: 1.1em;
  height: 0.9em;
}

.h5p-enable-fullscreen:focus,
.h5p-disable-fullscreen:focus {
  outline-style: solid;
  outline-width: 1px;
  outline-offset: 0.25em;
}

.h5p-enable-fullscreen:hover, .h5p-disable-fullscreen:hover {
  background: rgba(0,0,0,0.5);
}
.h5p-content-controls.themed .h5p-enable-fullscreen:hover, .h5p-content-controls.themed .h5p-disable-fullscreen:hover {
  background: rgba(0,0,0,0.5);
}
.h5p-semi-fullscreen .h5p-enable-fullscreen {
  display: none;
}

div.h5p-fullscreen {
  width: 100%;
  height: 100%;
}
.h5p-iframe-wrapper {
  width: auto;
  height: auto;
}

.h5p-fullscreen .h5p-iframe-wrapper,
.h5p-semi-fullscreen .h5p-iframe-wrapper {
  width: 100%;
  height: 100%;
}

.h5p-iframe-wrapper.h5p-semi-fullscreen {
  width: auto;
  height: auto;
  background: black;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 100001;
}
.h5p-iframe-wrapper.h5p-semi-fullscreen .buttons {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 20;
}
.h5p-iframe-wrapper iframe.h5p-iframe {
  /* Hack for IOS landscape / portrait */
  width: 10px;
  min-width: 100%;
  *width: 100%;
  /* End of hack */
  height: 100%;
  z-index: 10;
  overflow: hidden;
  border: 0;
  display: block;
}

.h5p-content ul.h5p-actions {
  box-sizing: border-box;
  -moz-box-sizing: border-box;
  list-style: none;
  padding: 0px 10px;
  margin: 0;
  height: 25px;
  font-size: 12px;
  background: #FAFAFA;
  border-top: 1px solid #EEE;
  border-bottom: 1px solid #EEE;
  clear: both;
  font-family: Sans-Serif;
}
.h5p-fullscreen .h5p-actions, .h5p-semi-fullscreen .h5p-actions {
  display: none;
}
.h5p-actions > .h5p-button {

  margin: 0 0.5em 0 0;
  background: none;

  color: #707070;
  text-decoration: none;
  outline: none;
  line-height: 22px;
}

  color: #333;
}

.h5p-content:has(.h5p-theme) .h5p-popup-dialog .h5p-download-button:disabled:before {

.h5p-content:has(.h5p-theme) .h5p-popup-dialog .h5p-big-button:hover {

.h5p-content:has(.h5p-theme) .h5p-popup-dialog .h5p-big-button:hover.h5p-big-button:before,
.h5p-content:has(.h5p-theme) .h5p-popup-dialog .h5p-big-button:hover .h5p-button-title,

      }

        text-align: left;
        border-width: .167em;
      }

        border-bottom-style: none;
      }

    figcaption {
      background-color: transparent;
      caption-side: top;
      color: #333;
      display: table-caption;
      font-size: .75em;
      outline-offset: -1px;

    clear: both;

<style>:root {
  --bg: #d9dde2;
  --panel: #ffffff;
  --panel-2: #f1f3f5;
  --ink: #161a21;
  --muted: #626c79;
  --line: #c8ced6;
  --line-soft: #e2e6ea;
  --accent: #12504a;
  --accent-ink: #ffffff;
  --accent-soft: #dfeae7;
  --good: #1c6d45;
  --mid: #a8730d;
  --bad: #a33232;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --rail: 310px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- Ossature ---------- */

.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
}

.topbar {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.wordmark {
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: -0.01em;
  margin: 0;
  font-weight: 600;
}

.topbar .note {
  font-size: 12.5px;
  color: var(--muted);
  margin-left: auto;
}

.body {
  display: grid;
  grid-template-columns: var(--rail) 1fr;
  min-height: 0;
}

.rail {
  border-right: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.stage {
  min-width: 0;
  overflow-y: auto;
  padding: 22px;
}

/* ---------- Rail ---------- */

.rail-section { padding: 16px 18px; }
.rail-section + .rail-section { border-top: 1px solid var(--line-soft); }
.rail-section.grow { flex: 1; min-height: 0; }

.rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.rail-head h2 {
  font-size: 13px;
  font-weight: 650;
  margin: 0;
  letter-spacing: 0.01em;
}

.rail-head .count {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ---------- Boutons ---------- */

.btn {
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 3px;
  padding: 7px 12px;
  font-size: 13.5px;
  transition: background 120ms ease, border-color 120ms ease;
}
.btn:hover { background: #e6e9ec; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover { background: #0d3d38; }

.btn-quiet {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
  padding: 4px 6px;
  font-size: 12.5px;
}
.btn-quiet:hover { background: var(--panel-2); color: var(--ink); }

.btn-wide { width: 100%; }

/* ---------- Zone de dépôt ---------- */

.dropzone {
  border: 1.5px dashed var(--line);
  border-radius: 4px;
  background: var(--panel-2);
  padding: 18px 16px;
  text-align: center;
}
.dropzone p {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--muted);
}

body.dragging .dropzone,
body.dragging .hero {
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ---------- Liste des contenus ---------- */

.packages { list-style: none; margin: 0; padding: 0; }

.packages li + li { margin-top: 4px; }

.pkg {
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 3px;
  padding: 8px 10px;
  display: block;
}
.pkg:hover { background: var(--panel-2); }
.pkg[aria-current="true"] {
  background: var(--accent-soft);
  border-color: #bcd2cd;
}
.pkg .t {
  font-size: 13.5px;
  font-weight: 550;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pkg .s {
  font-size: 12px;
  color: var(--muted);
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Résultats ---------- */

.score-readout {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 12px;
}
.score-readout .big {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.score-readout .lbl { font-size: 12.5px; color: var(--muted); }

.results { list-style: none; margin: 0; padding: 0; }
.results li {
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
  animation: rise 260ms ease both;
}
.results li:last-child { border-bottom: 0; }

.res-top {
  display: flex;
  gap: 10px;
  align-items: baseline;
  justify-content: space-between;
}
.res-name {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.res-score {
  font-size: 13px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.res-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.res-root .res-name { font-weight: 650; }

.bar {
  height: 3px;
  background: var(--line-soft);
  margin-top: 6px;
  border-radius: 2px;
  overflow: hidden;
}
.bar span { display: block; height: 100%; background: var(--mid); }
.bar.is-good span { background: var(--good); }
.bar.is-bad span { background: var(--bad); }

.empty {
  font-size: 12.5px;
  color: var(--muted);
  margin: 0;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

/* ---------- Scène ---------- */

.hero {
  max-width: 560px;
  margin: 8vh auto 0;
  background: var(--panel);
  border: 1.5px dashed var(--line);
  border-radius: 5px;
  padding: 46px 40px;
  text-align: center;
}
.hero h2 {
  font-family: var(--serif);
  font-size: 27px;
  font-weight: 600;
  margin: 0 0 8px;
  letter-spacing: -0.01em;
}
.hero p {
  margin: 0 auto 20px;
  color: var(--muted);
  max-width: 46ch;
  font-size: 14px;
}
.hero .fineprint {
  margin: 18px auto 0;
  font-size: 12.5px;
  max-width: 44ch;
}

.player-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.player-head h2 {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}
.player-head .lib {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.player-head .actions { margin-left: auto; display: flex; gap: 8px; }

.player-shell {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 18px;
}

.status {
  font-size: 13px;
  color: var(--muted);
  padding: 10px 0;
}
.status.error {
  color: var(--bad);
  background: #fbeeee;
  border: 1px solid #eccfcf;
  border-radius: 3px;
  padding: 10px 12px;
}

/* Le lecteur H5P remplit la largeur disponible */
.player-shell .h5p-iframe { width: 100%; }

@media (max-width: 900px) {
  .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 46vh; }
  .stage { padding: 16px; }
  .hero { margin-top: 4vh; padding: 32px 22px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1 class="wordmark">Visionneuse H5P</h1>
    <span class="note">Lecture hors ligne, dans votre navigateur</span>
  </header>

  <div class="body">
    <aside class="rail">
      <div class="rail-section">
        <div class="dropzone">
          <p>Déposez un fichier .h5p ici</p>
          <button class="btn btn-primary btn-wide" id="pick">Choisir un fichier</button>
        </div>
        <input type="file" id="file-input" accept=".h5p,application/zip" multiple hidden>
      </div>

      <div class="rail-section">
        <div class="rail-head">
          <h2>Contenus ouverts</h2>
          <span class="count" id="pkg-count"></span>
        </div>
        <ul class="packages" id="packages"></ul>
      </div>

      <div class="rail-section grow">
        <div class="rail-head">
          <h2>Résultats</h2>
          <span>
            <button class="btn-quiet" id="export">Exporter</button>
            <button class="btn-quiet" id="clear">Effacer</button>
          </span>
        </div>
        <div class="score-readout" id="readout" hidden>
          <span class="big" id="readout-big"></span>
          <span class="lbl" id="readout-lbl"></span>
        </div>
        <p class="empty" id="results-empty">Les scores apparaîtront ici dès qu’une réponse sera validée.</p>
        <ul class="results" id="results" aria-live="polite"></ul>
      </div>
    </aside>

    <main class="stage" id="stage"></main>
  </div>
</div>

<script>/* =========================================================================
   Visionneuse H5P — tout se passe dans le navigateur.
   Le paquet .h5p est un zip : on le décompresse en mémoire, on transforme
   chaque fichier en URL blob, puis on demande au cœur H5P de jouer le

    connectionLost: 'Connexion perdue. Les résultats seront envoyés au rétablissement.',
    connectionReestablished: 'Connexion rétablie.',
    resubmitScores: 'Nouvel envoi des résultats en cours.',
    offlineDialogHeader: 'La connexion au serveur a été perdue',
    offlineDialogBody: 'Impossible d\u2019envoyer les informations de progression.',
    offlineDialogRetryMessage: 'Nouvelle tentative dans :num…',

  var state = {
    packages: [],       // paquets chargés en mémoire

  var el = {};

  /* ---------------------------------------------------------------------

     --------------------------------------------------------------------- */

  function $(sel) { return document.querySelector(sel); }

  function mimeFor(path) {
    var ext = path.split('.').pop().toLowerCase();
    return MIME[ext] || 'application/octet-stream';
  }

  function normalize(path) {
    var parts = path.split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p === '' || p === '.') continue;
      if (p === '..') out.pop();
      else out.push(p);
    }
    return out.join('/');
  }

  function dirname(path) {
    var i = path.lastIndexOf('/');
    return i === -1 ? '' : path.slice(0, i);
  }

  function stripQuery(path) {
    return path.split('?')[0].split('#')[0];
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' Ko';
    return (bytes / 1024 / 1024).toFixed(1).replace('.', ',') + ' Mo';
  }

  function time(d) {
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  /* ---------------------------------------------------------------------
     Lecture d'un paquet .h5p
     --------------------------------------------------------------------- */

  function readPackage(file) {
    return JSZip.loadAsync(file).then(function (zip) {
      // Certains paquets sont zippés avec un dossier racine : on le détecte.
      var prefix = '';
      if (!zip.file('h5p.json')) {
        var candidates = Object.keys(zip.files).filter(function (n) {
          return /^[^/]+\/h5p\.json$/.test(n);
        });
        if (!candidates.length) {
          throw new Error('h5p.json est introuvable : ce fichier n\u2019est pas un paquet H5P.');
        }
        prefix = candidates[0].slice(0, -'h5p.json'.length);
      }

      var entries = {};
      zip.forEach(function (relPath, entry) {
        if (entry.dir) return;
        if (prefix && relPath.indexOf(prefix) !== 0) return;
        entries[relPath.slice(prefix.length)] = entry;
      });

      return entries['h5p.json'].async('string').then(function (txt) {
        var manifest = JSON.parse(txt);
        if (!manifest.mainLibrary || !manifest.preloadedDependencies) {
          throw new Error('Le fichier h5p.json est incomplet : impossible d\u2019identifier la librairie principale.');
        }
        return {
          id: 'pkg' + (++state.seq),
          fileName: file.name,
          size: file.size,
          title: manifest.title || file.name.replace(/\.h5p$/i, ''),
          manifest: manifest,
          entries: entries
        };
      });
    });
  }

  /* ---------------------------------------------------------------------
     Résolution des librairies (même algorithme que l'intégration H5P)
     --------------------------------------------------------------------- */

  function resolveLibraries(pkg) {
    var entries = pkg.entries;
    var manifest = pkg.manifest;

    function folderName(dep, withVersion) {
      var n = dep.machineName;
      if (withVersion) {
        if (dep.majorVersion !== undefined) n += '-' + dep.majorVersion;
        if (dep.minorVersion !== undefined) n += '.' + dep.minorVersion;

    }

    var withVersion = !!entries[folderName(manifest.preloadedDependencies[0], true) + '/library.json'];

    var libs = {};
    var pending = [];

    function queue(folder) {
      if (libs[folder] !== undefined) return;
      var def = entries[folder + '/library.json'];
      if (!def) { libs[folder] = null; return; }

      pending.push(def.async('string').then(function (txt) {
        var lib = JSON.parse(txt);
        var deps = (lib.preloadedDependencies || []).map(name);

          deps: deps,
          js: (lib.preloadedJs || []).map(function (x) { return folder + '/' + x.path; }),
          css: (lib.preloadedCss || []).map(function (x) { return folder + '/' + x.path; })
        };
        deps.forEach(queue);
      }));
    }

    roots.forEach(queue);

      var scripts = [], styles = [], done = {};

        var lib = libs[folder];
        stack.push(folder);
        if (lib) lib.deps.forEach(function (d) { visit(d, stack); });

     --------------------------------------------------------------------- */

      var base = dirname(path);
      return entry.async('string').then(function (css) {
        var out = css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (whole, q, ref) {
          if (/^(data:|blob:|https?:|\/\/|#)/i.test(ref)) return whole;
          var target = vfs[normalize(base + '/' + stripQuery(ref))];
          return target ? 'url("' + target + '")' : whole;
        });
        var url = URL.createObjectURL(new Blob([out], { type: 'text/css' }));
        state.urls.push(url);
        return url;
      });
    })).then(function (urls) {
      return urls.filter(Boolean);
    });
  }

  /* ---------------------------------------------------------------------
     Chargement des scripts / styles dans la page
     --------------------------------------------------------------------- */

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.dataset.h5p = '1';
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Script illisible : ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadScripts(list) {
    return list.reduce(function (chain, src) {
      return chain.then(function () { return loadScript(src); });
    }, Promise.resolve());
  }

  function loadStyles(list) {
    list.forEach(function (href) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      link.dataset.h5p = '1';
      document.head.appendChild(link);
    });
  }

  function teardown() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-h5p]'), function (n) {
      n.parentNode.removeChild(n);
    });
    if (window.H5P && window.H5P.instances) {
      window.H5P.instances.forEach(function (inst) {
        try { if (inst.remove) inst.remove(); } catch (e) { /* ignoré */ }
      });
    }
    try { delete window.H5P; } catch (e) { window.H5P = undefined; }
    try { delete window.H5PIntegration; } catch (e) { window.H5PIntegration = undefined; }
    state.urls.forEach(URL.revokeObjectURL);
    state.urls = [];
  }

  /* ---------------------------------------------------------------------
     Correctifs appliqués au cœur H5P pour qu'il lise le stockage virtuel
     --------------------------------------------------------------------- */

  function patchCore(vfs) {
    var H5P = window.H5P;

    // Médias du contenu : « images/photo.jpg » → URL blob.
    H5P.getPath = function (path, contentId) {
      if (/^(https?:|data:|blob:)/i.test(path)) return path;
      return vfs['content/' + stripQuery(path)] || path;
    };

    // Fichiers embarqués dans une librairie (sons, icônes, modèles…).
    var origLibraryPath = H5P.getLibraryPath;
    H5P.getLibraryPath = function (library) {
      return vfs[library] || (origLibraryPath ? origLibraryPath(library) : library);
    };

    var ContentType = H5P.ContentType;
    if (typeof ContentType === 'function') {
      H5P.ContentType = function (isRootLibrary) {
        var Type = ContentType(isRootLibrary);
        Type.prototype.getLibraryFilePath = function (filePath) {
          var lib = this.libraryInfo && this.libraryInfo.versionedNameNoSpaces;
          var full = lib ? lib + '/' + filePath : filePath;
          return vfs[normalize(full)] || full;
        };
        return Type;
      };
    }
  }

  /* ---------------------------------------------------------------------
     Ouverture d'un contenu
     --------------------------------------------------------------------- */

  function openPackage(id) {
    var pkg = state.packages.filter(function (p) { return p.id === id; })[0];
    if (!pkg) return;

    state.activeId = id;
    renderPackages();
    renderPlayerFrame(pkg, null);
    setStatus('Décompression du paquet…');

    teardown();

    var vfs, assets;

    resolveLibraries(pkg)
      .then(function (res) {
        assets = res;
        return buildVFS(pkg, function (i, total) {
          setStatus('Préparation des fichiers… ' + i + ' / ' + total);
        });
      })
      .then(function (built) {
        vfs = built;
        if (!pkg.entries['content/content.json']) {
          throw new Error('content/content.json est introuvable dans le paquet.');
        }
        setStatus('Chargement des librairies…');
        return Promise.all([
          pkg.entries['content/content.json'].async('string'),
          rewriteStyles(pkg, vfs, assets.styles)
        ]);
      })
      .then(function (parts) {
        var contentJson = parts[0];
        var styleUrls = parts[1];
        var scriptUrls = assets.scripts.map(function (p) { return vfs[p]; }).filter(Boolean);
        var cid = pkg.id;

        window.H5P = { preventInit: true };
        window.H5PIntegration = {
          baseUrl: location.origin,
          url: '',
          urlLibraries: '',
          postUserStatistics: false,
          saveFreq: false,
          ajax: {},
          l10n: { H5P: L10N },
          core: { scripts: [state.coreUrl], styles: [] },
          contents: {}
        };
        window.H5PIntegration.contents['cid-' + cid] = {
          library: assets.libraryName,
          title: pkg.title,
          url: 'h5p://' + encodeURIComponent(pkg.fileName),
          contentUrl: '',
          jsonContent: contentJson,
          styles: styleUrls,
          scripts: scriptUrls,
          fullScreen: true,
          embedCode: '',
          resizeCode: '',
          displayOptions: { frame: false, export: false, embed: false, copyright: false, icon: false, copy: false },
          metadata: { title: pkg.title, license: pkg.manifest.license || 'U' }
        };

        loadStyles(styleUrls);
        return loadScript(state.coreUrl)
          .then(function () {
            patchCore(vfs);
            listenForScores(pkg);
            return loadScripts(scriptUrls);
          })
          .then(function () {
            renderPlayerFrame(pkg, cid);
            window.H5P.preventInit = false;
            window.H5P.init(document.getElementById('h5p-host'));
            setStatus('');
          });
      })
      .catch(function (err) {
        console.error(err);
        setStatus(err && err.message ? err.message : 'Ce contenu n\u2019a pas pu être ouvert.', true);
      });
  }

  /* ---------------------------------------------------------------------
     Scores (xAPI)
     --------------------------------------------------------------------- */

  function listenForScores(pkg) {
    window.H5P.externalDispatcher.on('xAPI', function (event) {
      var st = event && event.data && event.data.statement;
      if (!st || !st.result || !st.result.score) return;
      var score = st.result.score;
      if (typeof score.raw !== 'number' || typeof score.max !== 'number') return;

      var verb = (st.verb && st.verb.display && (st.verb.display['en-US'] || st.verb.display['und'])) || '';
      if (verb !== 'answered' && verb !== 'completed' && verb !== 'passed' && verb !== 'failed') return;

      var def = (st.object && st.object.definition) || {};
      var name = (def.name && (def.name['en-US'] || def.name['fr-FR'] || def.name[Object.keys(def.name)[0]])) || '';
      var parents = st.context && st.context.contextActivities && st.context.contextActivities.parent;

      state.results.unshift({
        content: pkg.title,
        activity: stripTags(name) || pkg.title,
        raw: score.raw,
        max: score.max,
        root: !parents || !parents.length,
        at: new Date()
      });
      renderResults();
    });
  }

  function stripTags(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return (d.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 120);
  }

  function exportCsv() {
    var rows = [['Heure', 'Contenu', 'Activité', 'Score', 'Maximum', 'Pourcentage']];
    state.results.slice().reverse().forEach(function (r) {
      rows.push([
        r.at.toLocaleString('fr-FR'), r.content, r.activity,
        r.raw, r.max, r.max ? Math.round((r.raw / r.max) * 100) + '%' : ''
      ]);
    });
    var csv = rows.map(function (row) {
      return row.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');
    var url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'resultats-h5p.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ---------------------------------------------------------------------
     Rendu
     --------------------------------------------------------------------- */

  function setStatus(msg, isError) {
    var node = $('#status');
    if (!node) return;
    node.textContent = msg || '';
    node.className = 'status' + (isError ? ' error' : '');
    node.hidden = !msg;
  }

  function renderPackages() {
    el.count.textContent = state.packages.length ? state.packages.length : '';
    if (!state.packages.length) {
      el.packages.innerHTML = '';
      return;
    }
    el.packages.innerHTML = state.packages.map(function (p) {
      return '<li><button class="pkg" data-id="' + p.id + '" aria-current="' + (p.id === state.activeId) + '">' +
        '<span class="t">' + escapeHtml(p.title) + '</span>' +
        '<span class="s">' + escapeHtml(p.manifest.mainLibrary) + ' · ' + formatSize(p.size) + '</span>' +
        '</button></li>';
    }).join('');
  }

  function renderResults() {
    var last = state.results.filter(function (r) { return r.root; })[0] || state.results[0];
    if (last && last.max) {
      el.readout.hidden = false;
      el.readoutBig.textContent = Math.round((last.raw / last.max) * 100) + ' %';
      el.readoutLbl.textContent = last.raw + ' sur ' + last.max + ' · ' + last.activity;
    } else {
      el.readout.hidden = true;
    }

    el.resultsEmpty.hidden = state.results.length > 0;
    el.exportBtn.disabled = !state.results.length;
    el.clearBtn.disabled = !state.results.length;

    el.results.innerHTML = state.results.map(function (r) {
      var pct = r.max ? Math.round((r.raw / r.max) * 100) : 0;
      var tone = pct >= 80 ? ' is-good' : (pct < 50 ? ' is-bad' : '');
      return '<li class="' + (r.root ? 'res-root' : '') + '">' +
        '<div class="res-top">' +
          '<span class="res-name">' + escapeHtml(r.activity) + '</span>' +
          '<span class="res-score">' + r.raw + ' / ' + r.max + '</span>' +
        '</div>' +
        '<div class="bar' + tone + '"><span style="width:' + pct + '%"></span></div>' +
        '<div class="res-meta">' + time(r.at) + (r.root ? ' · résultat global' : '') + '</div>' +
        '</li>';
    }).join('');
  }

  function renderPlayerFrame(pkg, cid) {
    el.stage.innerHTML =
      '<div class="player-head">' +
        '<h2>' + escapeHtml(pkg.title) + '</h2>' +
        '<span class="lib">' + escapeHtml(pkg.manifest.mainLibrary) + '</span>' +
        '<div class="actions">' +
          '<button class="btn" id="restart">Recommencer</button>' +
          '<button class="btn" id="fullscreen">Plein écran</button>' +
        '</div>' +
      '</div>' +
      '<p class="status" id="status" hidden></p>' +
      '<div class="player-shell" id="h5p-host">' +
        (cid ? '<div class="h5p-content" data-content-id="' + cid + '"></div>' : '') +
      '</div>';

    $('#restart').addEventListener('click', function () { openPackage(pkg.id); });
    $('#fullscreen').addEventListener('click', goFullscreen);
  }

  function renderEmptyStage() {
    el.stage.innerHTML =
      '<div class="hero">' +
        '<h2>Ouvrez un contenu H5P</h2>' +
        '<p>Déposez un fichier .h5p n\u2019importe où sur cette page pour le lire, le tester et relever les scores.</p>' +
        '<button class="btn btn-primary" id="hero-pick">Choisir un fichier</button>' +
        '<p class="fineprint">Rien ne quitte votre ordinateur : le paquet est décompressé et joué directement dans le navigateur.</p>' +
      '</div>';
    $('#hero-pick').addEventListener('click', function () { el.input.click(); });
  }

  function goFullscreen() {
    var host = document.querySelector('#h5p-host .h5p-container');
    var H5P = window.H5P;
    try {
      if (host && H5P && H5P.fullScreen && H5P.instances && H5P.instances.length) {
        H5P.fullScreen(H5P.jQuery(host), H5P.instances[H5P.instances.length - 1]);
        return;
      }
    } catch (e) { /* on retombe sur l'API navigateur */ }
    var target = document.getElementById('h5p-host');
    if (target && target.requestFullscreen) target.requestFullscreen();
  }

  /* ---------------------------------------------------------------------
     Entrées fichiers
     --------------------------------------------------------------------- */

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) {
      return /\.h5p$/i.test(f.name) || f.type === 'application/zip';
    });
    if (!files.length) {
      alert('Choisissez un fichier .h5p.');
      return;
    }
    files.reduce(function (chain, file) {
      return chain.then(function () {
        return readPackage(file).then(function (pkg) {
          state.packages.push(pkg);
          renderPackages();
          if (state.packages.length === 1 || files.length === 1) openPackage(pkg.id);
        });
      }).catch(function (err) {
        console.error(err);
        alert(file.name + ' : ' + (err.message || 'lecture impossible.'));
      });
    }, Promise.resolve());
  }

  /* ---------------------------------------------------------------------
     Démarrage
     --------------------------------------------------------------------- */

  function init() {
    el.stage = $('#stage');
    el.packages = $('#packages');
    el.count = $('#pkg-count');
    el.results = $('#results');
    el.resultsEmpty = $('#results-empty');
    el.readout = $('#readout');
    el.readoutBig = $('#readout-big');
    el.readoutLbl = $('#readout-lbl');
    el.exportBtn = $('#export');
    el.clearBtn = $('#clear');
    el.input = $('#file-input');

    // Le cœur H5P est embarqué dans la page : on en fait une URL blob réutilisable.
    var b64 = document.getElementById('h5p-core-js').textContent.replace(/\s+/g, '');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    state.coreUrl = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));

    el.input.addEventListener('change', function (e) {
      handleFiles(e.target.files);
      e.target.value = '';
    });
    $('#pick').addEventListener('click', function () { el.input.click(); });
    el.exportBtn.addEventListener('click', exportCsv);
    el.clearBtn.addEventListener('click', function () {
      state.results = [];
      renderResults();
    });

    el.packages.addEventListener('click', function (e) {
      var btn = e.target.closest('.pkg');
      if (btn) openPackage(btn.dataset.id);
    });

    var depth = 0;
    window.addEventListener('dragenter', function (e) {
      e.preventDefault();
      depth++;
      document.body.classList.add('dragging');
    });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('dragleave', function () {
      if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); }
    });
    window.addEventListener('drop', function (e) {
      e.preventDefault();
      depth = 0;
      document.body.classList.remove('dragging');
      if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    window.addEventListener('resize', function () {
      if (window.H5P && window.H5P.instances) {
        window.H5P.instances.forEach(function (i) {
          try { window.H5P.trigger(i, 'resize'); } catch (e) { /* ignoré */ }
        });
      }
    });

    renderEmptyStage();
    renderPackages();
    renderResults();
  }



  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
